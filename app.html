<style>
/* Layout: iPad-first app shell. Sticky header with clock and nav; dashboard = "Jetzt"-card + Fächer-grid; each subject has Heft / Hausaufgaben / Module. */
:root{
  --bg:#eef1f8; --surface:#ffffff; --surface-2:#f5f7fc; --ink:#18203d; --muted:#586082; --line:#d8ddee;
  --navy:#26337a; --red:#cf3a2c; --yellow:#f2b51d; --green:#1f8f5d; --blue:#2f6fd6; --orange:#e8743b;
  --on-accent:#ffffff; --on-bright:#18203d; --ok-bg:#dff4e9; --warn-bg:#fdf0d2; --late-bg:#fde3df;
  --f-display:"Baloo 2","Arial Rounded MT Bold",ui-rounded,system-ui,sans-serif;
  --f-body:"Nunito",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:18px;
  --shadow:0 2px 0 rgba(24,32,61,.07),0 10px 24px rgba(24,32,61,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1328; --surface:#181e3c; --surface-2:#1f274a; --ink:#eef0fa; --muted:#a4acce; --line:#2e3768;
  --navy:#a3b3ff; --red:#ff7b6c; --yellow:#ffcb47; --green:#4fd394; --blue:#7fabff; --orange:#ff9a62;
  --on-accent:#0f1328; --ok-bg:#173a2d; --warn-bg:#3a3017; --late-bg:#45201d;
  --shadow:0 2px 0 rgba(0,0,0,.25),0 10px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1328; --surface:#181e3c; --surface-2:#1f274a; --ink:#eef0fa; --muted:#a4acce; --line:#2e3768;
  --navy:#a3b3ff; --red:#ff7b6c; --yellow:#ffcb47; --green:#4fd394; --blue:#7fabff; --orange:#ff9a62;
  --on-accent:#0f1328; --ok-bg:#173a2d; --warn-bg:#3a3017; --late-bg:#45201d;
  --shadow:0 2px 0 rgba(0,0,0,.25),0 10px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:var(--f-display);line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:clamp(1.6rem,3.4vw,2.3rem)} h2{font-size:clamp(1.3rem,2.6vw,1.7rem)} h3{font-size:1.2rem}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:2px;background:none;border:0;padding:0;cursor:pointer;font-family:var(--f-display);font-weight:800;font-size:1.7rem;line-height:1;letter-spacing:.02em}
:root{--brand-g:linear-gradient(120deg,#1f7bff 0%,#3d55f0 55%,#6b4cf6 100%);--brand-ink:#2c3ad6}
.logo,.biglogo{color:var(--brand-ink)}@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .logo,:root:not([data-theme=light]) .biglogo{color:#a9b6ff}}:root[data-theme=dark] .logo,:root[data-theme=dark] .biglogo{color:#a9b6ff}
.lg-t{letter-spacing:.04em}
.lg-e{height:1em;width:auto;margin:0 2px 0 0;display:inline-block}.biglogo .lg-e{height:.82em}
.si-owl{width:2.6rem;height:2.6rem;object-fit:contain;vertical-align:middle;filter:drop-shadow(0 2px 3px rgba(44,58,214,.18))}.st-h{display:flex;align-items:center;gap:8px}.st-h img{width:52px;height:52px;margin:-8px 0}
.elo-help{display:flex;gap:12px;align-items:center;margin-bottom:10px}.elo-help img{width:84px;height:84px;flex:none;object-fit:contain;filter:drop-shadow(0 4px 6px rgba(44,58,214,.2))}.elo-help .bub{position:relative;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:8px 12px;font-weight:800}
.logo .on{display:inline-flex;align-items:center;gap:5px;background:var(--brand-g);color:#fff;border-radius:999px;padding:2px 4px 0 11px}
.logo .on i{width:18px;height:18px;border-radius:50%;background:#fff;display:inline-block;margin-top:-2px}
.nav{display:flex;gap:6px;flex-wrap:wrap}
.nav button{border:0;background:none;padding:8px 12px;border-radius:12px;font-weight:800;cursor:pointer;color:var(--muted);min-height:42px}
.nav button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.spacer{flex:1}
.clock{font-family:var(--f-display);font-weight:800;font-size:1.25rem;font-variant-numeric:tabular-nums}
.clock.sim{color:var(--orange)}
.stars{display:flex;align-items:center;gap:6px;font-weight:800;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-variant-numeric:tabular-nums}
.stars svg{width:20px;height:20px}

main{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:20px 48px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-weight:800;cursor:pointer;touch-action:manipulation;transition:transform .08s}
.btn svg{width:20px;height:20px;flex:none}
.btn:active{transform:translateY(2px)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:var(--on-accent)}
.btn.ok{background:var(--green);border-color:var(--green);color:var(--on-accent)}
.btn.red{background:var(--red);border-color:var(--red);color:var(--on-accent)}
.btn.sm{min-height:40px;padding:6px 12px;font-size:.9rem;border-radius:12px}
.btn[disabled]{opacity:.45;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-size:.8rem;font-weight:800;letter-spacing:.02em;color:var(--muted)}
.chip.ex{border-style:dashed;color:var(--orange);border-color:var(--orange)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.muted{color:var(--muted)}
.label{font-size:.75rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.empty{padding:22px;border:2px dashed var(--line);border-radius:16px;text-align:center;color:var(--muted);font-weight:700}

/* Subject colours: fixed, white text works in both themes */
.s-WK{--sc:#b0521a}.s-ES{--sc:#c2477f}.s-T{--sc:#55606e}.s-S{--sc:#1f8f4e}.s-GS{--sc:#8d6b12}.s-ET{--sc:#5b57b8}.s-R{--sc:#7a4a2a}.s-GD{--sc:#3d6f8f}.s-DZ{--sc:#0f7c9c}
.art-der{color:#2f63c8;font-weight:800}.art-die{color:#cf3a2c;font-weight:800}.art-das{color:#1f8f5d;font-weight:800}
.s-E{--sc:#c8402f}.s-M{--sc:#2f63c8}.s-K{--sc:#8a4fc1}.s-D{--sc:#0e8577}.s-G{--sc:#a8650f}.s-N{--sc:#3f8a2b}.s-I{--sc:#4a5d78}.s-W{--sc:#c03a74}
.sbadge{flex:none;width:44px;height:44px;border-radius:12px;background:var(--sc);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.05rem}

/* Dashboard */
.dash{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:820px){.dash{grid-template-columns:1fr}}
.now{border-radius:22px;padding:22px;background:var(--sc,var(--navy));color:#fff;box-shadow:var(--shadow);position:relative;overflow:hidden}
.now.idle{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.now .k{font-size:.8rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.now h2{font-size:clamp(2rem,5vw,3rem);margin-block:2px 4px;padding-right:70px}
.now .bar{height:10px;border-radius:10px;background:rgba(255,255,255,.3);margin-top:14px;overflow:hidden}
.now .bar i{display:block;height:100%;background:#fff}
.now .btn{border-color:#fff;background:#fff;color:#18203d}
.now .btn.ghost{background:transparent;color:#fff}
.now .elo{position:absolute;right:14px;top:14px}
.today{display:grid;gap:6px;margin-top:10px}
.slot-row{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:12px}
.slot-row.cur{background:var(--surface-2);box-shadow:inset 0 0 0 2px var(--sc)}
.slot-row.past{opacity:.5}
.slot-row .sbadge{width:34px;height:34px;font-size:.85rem;border-radius:10px}
.slot-row .tm{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:700;width:104px;flex:none;font-size:.9rem}
.subj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,170px),1fr));gap:12px;margin-top:10px}

.who{flex:none;width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;font-weight:800;font-size:.85rem;color:var(--on-accent)}
.who.A{background:var(--blue)}.who.B{background:var(--red)}
.line .tx{flex:1;min-width:0;font-weight:700;font-size:1.08rem}
.line.mine{border-color:var(--yellow);background:var(--warn-bg)}
.line.theirs .tx{color:var(--muted)}
.line .de{font-style:italic}
.ear{color:var(--muted);font-weight:800}
.gap{display:inline-block;min-width:70px;border:0;border-bottom:3px dotted var(--navy);background:none;padding:0 4px;font-weight:800;color:var(--navy);cursor:pointer}
.gap.shown{border-bottom-style:solid}
.icon-btn{flex:none;width:40px;height:40px;border-radius:12px;border:2px solid var(--line);background:var(--surface-2);display:grid;place-items:center;cursor:pointer}
.icon-btn svg{width:20px;height:20px}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:560px){.steps{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stepb{flex-direction:column;gap:0;min-height:62px;line-height:1.1}
.stepb small{font-weight:700;color:var(--muted)}
.stepb.on{border-color:var(--navy);background:var(--surface-2);box-shadow:inset 0 -4px 0 var(--navy)}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:14px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:10px 14px;font-weight:800;cursor:pointer;min-height:46px}
.seg button.on{background:var(--navy);color:var(--on-accent)}
.rolecards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px}
.rolecard{border-radius:18px;padding:18px;border:3px solid var(--line);background:var(--surface)}
.rolecard.A{border-color:var(--blue)}.rolecard.B{border-color:var(--red)}
.rolecard ul{margin:8px 0 0;padding-left:20px;font-weight:700}
.rolecard.dim{opacity:.4}
.pool{display:grid;gap:8px}
.slot{min-height:52px;border:2px dashed var(--line);border-radius:14px;display:flex;align-items:center;padding:8px 12px;color:var(--muted);font-weight:700}
.corners{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.corner{min-height:120px;border-radius:18px;border:0;padding:14px;text-align:left;cursor:pointer;color:var(--on-bright);font-weight:800;display:flex;flex-direction:column;justify-content:space-between}
.corner b{font-family:var(--f-display);font-size:1.5rem}
.c1{background:#ffd95e}.c2{background:#ffb57d}.c3{background:#8fe0b5}.c4{background:#9cc2ff}
[hidden]{display:none!important}
textarea,input[type=text],input[type=url],input[type=search],input[type=number],input[type=time],input[type=password],select{font:inherit;width:100%;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}

/* Week */
.wk{overflow-x:auto}
.wk table{border-collapse:separate;border-spacing:6px;min-width:640px;width:100%}
.wk th{font-family:var(--f-display);text-align:left;color:var(--muted);font-size:.95rem}
.wk td{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-weight:800;height:52px;vertical-align:middle}
.wk td.has{background:var(--sc);color:#fff;border-color:var(--sc)}
.wk td.cur{box-shadow:0 0 0 3px var(--yellow)}
.wk td.tm{background:none;border:0;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums;font-size:.85rem;white-space:nowrap}

/* Board */
.board{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.board > *{grid-column:span 6}
.board .wide{grid-column:span 12}
@media (max-width:820px){.board > *{grid-column:span 12}}
.timer{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.ring{--p:1;width:170px;height:170px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--navy) calc(var(--p)*360deg),var(--surface-2) 0);flex:none}
.ring div{width:138px;height:138px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--f-display);font-size:2.6rem;font-weight:800;font-variant-numeric:tabular-nums}
.sig{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sig .btn{min-height:76px;flex-direction:column;gap:2px;line-height:1.1}
.sig .btn small{font-weight:700;opacity:.8}
.pairs{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.pairs span{padding:6px 12px;border-radius:12px;background:var(--surface-2);border:2px solid var(--line);font-weight:800;font-variant-numeric:tabular-nums}
.rocket{display:flex;gap:16px;align-items:flex-end}
.fuel{display:flex;flex-direction:column-reverse;gap:4px;width:44px;flex:none}
.fuel i{height:16px;border-radius:5px;background:var(--surface-2);border:1px solid var(--line)}
.fuel i.on{background:var(--orange);border-color:var(--orange)}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px;margin-top:12px}
.lib article{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--surface-2);min-width:0}
.lib article h3{font-size:1.1rem;margin-bottom:4px}
.lib .tag{font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--red)}
.jobs{display:grid;gap:8px;margin-top:10px}
.jobs div{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 12px;border-radius:12px;background:var(--surface-2)}
.jobs b{font-variant-numeric:tabular-nums;font-family:var(--f-display);font-size:1.2rem}

/* Overlay */
.ov{position:fixed;inset:0;z-index:20;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px}
.ov[hidden]{display:none}
.ov .box{max-width:460px;width:100%;text-align:center;background:var(--surface);border-radius:24px;border:3px solid var(--yellow);padding:24px;box-shadow:var(--shadow);animation:pop .4s;max-height:100%;overflow:auto}
.ov .box.change{border-color:var(--sc);text-align:left}
.ov .post{font-size:4rem;line-height:1.1}
.prep{display:grid;gap:8px;margin-top:12px}
.prep button{display:flex;gap:12px;align-items:center;text-align:left;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--surface-2);font-weight:800;cursor:pointer;min-height:52px}
.prep button i{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;font-style:normal}
.prep button.on i{background:var(--green);border-color:var(--green);color:var(--on-accent)}
.saved{margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--ok-bg);font-weight:700}
.foot{margin-top:28px;font-size:.85rem;color:var(--muted);text-align:center}
/* Live banner (students) */
#live{border-top:1px solid var(--line);background:var(--surface)}
.live-in{max-width:1180px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dot{flex:none;width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px color-mix(in srgb,var(--green) 25%,transparent)}
.dot.off{background:var(--muted);box-shadow:none}
.ph-txt{color:var(--muted);font-weight:700;min-width:0}
.ltimer{font-family:var(--f-display);font-weight:800;font-size:1.3rem;font-variant-numeric:tabular-nums}
.land{position:relative;aspect-ratio:1671/941;border-radius:22px;overflow:hidden;margin:0 0 16px;box-shadow:0 10px 30px rgba(30,58,138,.18);container-type:inline-size}
.land-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.land-i{position:absolute;transform:translate(-50%,-50%);width:15.5%;min-height:6.4%;border:0;border-radius:1.2cqw;background:#fff;color:#1e3a8a;font:inherit;font-size:clamp(.55rem,1.7cqw,1.05rem);line-height:1.1;padding:.6cqw .8cqw;cursor:pointer;box-shadow:0 .4cqw 1cqw rgba(0,0,0,.18);display:grid;place-items:center;text-align:center}
.land-i.done{background:#dcfce7;color:#166534}.land-i.locked{background:#e5e7eb;color:#6b7280;cursor:default}.land-i.cur{outline:.35cqw solid #4f46e5}
.land-elo{position:absolute;width:10%;transform:translate(-50%,-112%);transition:left 1s cubic-bezier(.3,1.4,.5,1),top 1s cubic-bezier(.3,1.4,.5,1);filter:drop-shadow(0 .6cqw .6cqw rgba(0,0,0,.3));animation:landb 2.2s ease-in-out infinite;pointer-events:none}
@keyframes landb{50%{transform:translate(-50%,-120%)}}
.land-st{position:absolute;left:1.2%;bottom:2%;background:rgba(255,255,255,.92);border-radius:999px;padding:.5cqw 1.6cqw;font-weight:800;font-size:clamp(.6rem,1.6cqw,1rem);color:#1e3a8a}
@media (prefers-reduced-motion:reduce){.land-elo{animation:none;transition:none}}
.bw-idle{position:relative;background:#eef2ff;overflow:hidden}.bw-idle>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.v-row{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
.v-card{margin:0;background:#fff;border:2px solid #e0e7ff;border-radius:16px;padding:10px;display:grid;justify-items:center;gap:6px;min-width:96px;max-width:150px;flex:1 1 96px;text-align:center;box-shadow:0 2px 8px rgba(30,58,138,.06)}
.v-card figcaption{display:grid;gap:2px;font-weight:700;font-size:.9rem;color:#1e3a8a;line-height:1.2}.v-card figcaption span{color:#475569;font-weight:700;font-size:.85rem}
.v-clock{width:100%;max-width:110px;height:auto;display:block}
.v-pic{font-size:2.6rem;line-height:1.1}.v-pic.v-txt{font-family:var(--f-display);font-size:1.7rem;color:#4f46e5}
.v-sw{width:56px;height:56px;border-radius:50%;border:2px solid #cbd5e1;display:block}
.v-dlg{display:grid;gap:8px;margin:10px 0;max-width:560px}.v-msg{display:flex;gap:8px;align-items:flex-end}.v-msg.r{flex-direction:row-reverse}
.v-who{font-size:1.8rem;line-height:1}.v-name{font-size:.78rem;font-weight:800;color:#1e3a8a;background:#e0f2fe;border-radius:999px;padding:3px 9px;white-space:nowrap;margin-bottom:4px}.v-bub{background:#eef2ff;border:2px solid #c7d2fe;border-radius:16px 16px 16px 4px;padding:8px 12px;font-weight:700;color:#1e3a8a}.v-msg.r .v-bub{background:#4f46e5;border-color:#4f46e5;color:#fff;border-radius:16px 16px 4px 16px}
.v-satz{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.v-blk{position:relative;background:#e0f2fe;border:2px solid #7dd3fc;border-radius:12px;padding:12px 14px 8px;font-weight:800;color:#1e3a8a}.v-blk small{position:absolute;top:1px;left:6px;font-size:.62rem;color:#64748b}
.v-blk.vb{background:#4f46e5;border-color:#4f46e5;color:#fff}.v-blk.vb small{color:#c7d2fe}.v-vb{color:inherit}.v-blk:not(.vb) .v-vb{color:#4f46e5}.v-ar{color:#c2410c;background:#ffedd5;border-radius:6px;padding:0 4px}
.v-zahl figcaption{grid-auto-flow:column;gap:4px;align-items:center}.v-e{background:#e0f2fe;border-radius:8px;padding:2px 6px}.v-z{background:#ede9fe;border-radius:8px;padding:2px 6px}.v-u{color:#64748b}
.v-geld{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0}.v-geld b{color:#1e3a8a;font-size:1.05rem;margin-left:6px}
.v-note{background:linear-gradient(135deg,#bfdbfe,#c7d2fe);border:2px solid #6366f1;border-radius:8px;padding:10px 14px;font-weight:800;color:#1e3a8a}
.v-coin{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:.7rem;font-weight:800;color:#78350f;background:radial-gradient(circle at 35% 30%,#fef3c7,#f59e0b);border:2px solid #d97706}.v-coin.cu{background:radial-gradient(circle at 35% 30%,#fed7aa,#c2410c);color:#fff;border-color:#9a3412;width:38px;height:38px}
.v-prae{width:100%;max-width:110px}
.v-wide{margin:12px 0;background:#fff;border:2px solid #e0e7ff;border-radius:16px;padding:12px}.v-wide figcaption{font-weight:700;color:#475569;font-size:.9rem;margin-top:6px}.v-wide svg{width:100%;max-width:560px;display:block;margin:0 auto}.v-wide svg.v-waage{max-width:380px}
.v-kach{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-end}.v-kach i{font-style:normal;font-weight:800;color:#1e3a8a;font-size:1.3rem;padding:0 4px}
.v-k{display:grid;place-items:center;font-weight:800;color:#fff;border-radius:6px}.v-k.kx{width:26px;height:78px;background:#4f46e5}.v-k.ky{width:26px;height:58px;background:#a855f7}.v-k.k1{width:26px;height:26px;background:#f59e0b}
.v-proz{max-width:190px}.v-hund{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;width:150px}.v-hund i{aspect-ratio:1;background:#e0e7ff;border-radius:2px}.v-hund i.on{background:#4f46e5}
.v-gw-bar{height:44px;background:#e0e7ff;border:2px solid #1e3a8a;border-radius:10px;overflow:hidden}.v-gw-bar i{display:grid;place-items:center;height:100%;background:#4f46e5;color:#fff;font-weight:800;font-style:normal}
.v-gw-l span{display:block;text-align:center;font-weight:800;color:#4f46e5;font-size:.85rem;margin-top:4px;min-width:90px}.v-gw-all{text-align:center;font-weight:800;color:#1e3a8a;margin-top:2px;border-top:2px dashed #1e3a8a;padding-top:4px}
.v-ds{display:grid;gap:4px;max-width:420px;margin:0 auto}.v-ds-row{display:flex;gap:10px;justify-content:center;align-items:center}.v-ds-row b{background:#eef2ff;border:2px solid #c7d2fe;border-radius:10px;padding:6px 12px;color:#1e3a8a;min-width:110px;text-align:center}.v-ds-row i{font-style:normal;color:#64748b}
.v-ds-op{display:flex;justify-content:space-between;padding:0 30px;color:#f59e0b;font-weight:800}
.ak-c .v-clock,.qz-pick .v-clock,.ak-mc h2 .v-clock{width:4.2em;display:inline-block;vertical-align:middle}
.clsbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#eef2ff;border:2px solid #c7d2fe;border-radius:14px;padding:8px 12px;margin:0 0 12px;font-weight:700;color:#334155}.clsbar>b{background:#4f46e5;color:#fff;border-radius:999px;padding:3px 12px}
.srail{position:fixed;right:10px;top:50%;transform:translateY(-50%);z-index:45;display:flex;flex-direction:column;gap:10px}
.srail[hidden]{display:none}
.sr-b{width:64px;height:64px;border-radius:50%;border:2px solid var(--line);background:var(--surface);box-shadow:0 4px 14px rgba(15,23,42,.18);display:grid;place-content:center;justify-items:center;gap:0;cursor:pointer;font:inherit;color:var(--ink);padding:0}
.sr-b span{font-size:1.5rem;line-height:1}.sr-b small{font-size:.62rem;font-weight:800;line-height:1.1;margin-top:2px}
.sr-b.on{background:#dc2626;border-color:#dc2626;color:#fff;animation:srp 1.6s ease-in-out infinite}.sr-b.ok{background:#16a34a;border-color:#16a34a;color:#fff}
@keyframes srp{50%{box-shadow:0 0 0 8px rgba(220,38,38,.25)}}
body.boardwin .srail{display:none!important}
.lov{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:16px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(8px)}
.lov[hidden]{display:none}
.lov .box{max-width:480px;width:100%;background:var(--surface);border-radius:24px;border:3px solid var(--navy);padding:24px;box-shadow:var(--shadow);animation:pop .4s;max-height:100%;overflow:auto}
.lov.full{background:var(--surface)}
.look{text-align:center;display:grid;justify-items:center;gap:8px}
.look h1{font-size:clamp(3rem,10vw,6rem)}
.look p{font-size:1.4rem;font-weight:800;color:var(--muted)}
.opt.c1,.opt.c2,.opt.c3,.opt.c4{color:var(--on-bright);border-color:transparent}

/* Start screen */
.legal-f{text-align:center;font-size:.85rem;padding:18px 0 28px;color:var(--muted)}.legal-f a{color:inherit}.legal-p{max-width:760px;display:grid;gap:10px}.legal-p h2{font-size:1.15rem;margin-top:10px}.legal-p ul{margin:0;padding-left:1.2em;display:grid;gap:4px}
.splash{min-height:70vh;display:grid;place-content:center;justify-items:center;gap:18px;text-align:center}
.biglogo{display:flex;align-items:center;gap:6px;font-family:var(--f-display);font-weight:800;font-size:clamp(4rem,14vw,8rem);line-height:1;letter-spacing:.02em}
.biglogo .on{display:inline-flex;align-items:center;gap:.14em;background:var(--brand-g);color:#fff;border-radius:999px;padding:.06em .1em 0 .32em}
.biglogo .on i{width:.62em;height:.62em;border-radius:50%;background:#fff;display:inline-block;margin-top:-.08em}
.splash-glow{display:grid;place-items:center;width:clamp(170px,30vw,240px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 50% 55%,rgba(107,76,246,.28),rgba(31,123,255,.12) 48%,transparent 70%);margin-bottom:-14px}.splash-elo{width:88%;height:auto;aspect-ratio:1;filter:drop-shadow(0 10px 18px rgba(44,58,214,.25));animation:elo-bob 3.2s ease-in-out infinite}@keyframes elo-bob{50%{transform:translateY(-6px)}}@media (prefers-reduced-motion:reduce){.splash-elo{animation:none}}
.tagline{font-size:1.2rem;font-weight:800;color:var(--muted);letter-spacing:.04em}
.btn.big{min-height:64px;padding:12px 40px;font-size:1.3rem;border-radius:18px}
.start{max-width:860px;margin:0 auto}
.start-head{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:12px;margin-top:16px}
.pick-card{display:flex;flex-direction:column;gap:4px;text-align:left;padding:20px;border-radius:18px;border:2px solid var(--line);background:var(--surface);box-shadow:var(--shadow);cursor:pointer;font-weight:700}
.pick-card b{font-family:var(--f-display);font-size:1.4rem;line-height:1.1}
.pick-card b.cl{font-size:3rem;color:var(--navy)}
.pick-card:hover{border-color:var(--navy)}
/* Role screen */
.role-wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:18px;margin-top:16px}
.numgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:8px;margin-top:10px}
.numgrid .btn{min-height:56px;font-family:var(--f-display);font-size:1.3rem;padding:0}
.err{color:var(--red);font-weight:800;margin-top:8px}

/* Tafel (teacher dashboard for Apple TV) */
.tafel{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px;align-items:start}
.t-head{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center}
@media (max-width:820px){.tafel,.t-head{grid-template-columns:1fr}}
.t-big{font-size:clamp(2.4rem,5vw,4rem)}
.t-top{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:stretch;margin-bottom:16px}
.t-top .t-head{grid-column:auto;padding:16px;align-items:start;margin:0}
.t-top .t-big{font-size:clamp(1.6rem,2.6vw,2.4rem)}
.t-top .t-txt{font-size:1.02rem}
.t-top .ring{width:96px;height:96px;align-self:start}.t-top .ring div{width:76px;height:76px;font-size:1.45rem}
.tprev-w{min-width:0;margin:0;padding:16px;display:flex;flex-direction:column;justify-content:center;gap:8px}.tprev-f{justify-content:space-between;font-weight:700}
.tprev{aspect-ratio:16/9;border-radius:14px;overflow:hidden;border:2px solid var(--line,var(--surface-2));box-shadow:0 6px 18px rgba(0,0,0,.12);background:var(--bg)}
.tprev .bw-kf{overflow:auto}.tprev{position:relative}
.tmir{transform-origin:0 0;pointer-events:none;overflow:hidden;background:var(--bg)}.tmir.tb{padding:24px 32px}.tmir .bw{height:100%}.tmir-ph{display:grid;place-items:center;height:60%;font-size:2rem;font-weight:800;background:#000;color:#fff;border-radius:12px}
.tmir-live{position:absolute;bottom:6px;right:8px;background:rgba(200,40,40,.9);color:#fff;font-weight:800;font-size:.72rem;padding:2px 8px;border-radius:999px}
.t-top+.ctrl{margin-top:0;margin-bottom:16px}
@media (max-width:820px){.t-top{grid-template-columns:1fr}}
.t-txt{font-size:1.3rem;font-weight:700;color:var(--muted);margin-top:4px}

@keyframes kfin{from{opacity:0;transform:perspective(900px) rotateX(55deg) scale(.6)}to{opacity:1;transform:none}}

@keyframes kfpop{0%{opacity:0;transform:scale(.3)}15%{opacity:1;transform:scale(1.15)}25%{transform:scale(1)}85%{opacity:1}100%{opacity:0}}
@keyframes kffade{from{opacity:0}to{opacity:1}}
@keyframes kfgoal{0%{transform:scale(.2) rotate(-12deg);opacity:0}100%{transform:scale(1) rotate(-4deg);opacity:1}}

let SIM=null; // {day:0..4, min, setAt}
const toMin=t=>{const [h,m]=t.split(':').map(Number);return h*60+m};
function nowInfo(){
  if(SIM){const el=Math.floor((Date.now()-SIM.setAt)/60000);return {day:SIM.day,min:SIM.min+el,sim:true}}
  const d=new Date();return {day:d.getDay()-1,min:d.getHours()*60+d.getMinutes(),sim:false};
}
function slotNow(){
  const n=nowInfo();
  if(n.day<0||n.day>4)return {kind:'weekend',n};
  const lessons=PERIODS.map((p,i)=>({p:p[0],start:toMin(p[1]),end:toMin(p[2]),from:p[1],to:p[2],s:WEEK[n.day][i]})).filter(l=>l.s);
  if(!lessons.length)return {kind:'free',n};
  for(const l of lessons){if(n.min>=l.start&&n.min<l.end)return {kind:'lesson',l,n,next:lessons.find(x=>x.start>=l.end)}}
  const next=lessons.find(l=>l.start>n.min);
  if(n.min<lessons[0].start)return {kind:'before',next,n};
  if(next)return {kind:'break',next,n};
  return {kind:'after',n};
}

function tone(f,start,dur,type='sine',vol=.22){
  const a=ctx();if(!a)return;
  const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+start;
  o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.05);
}

function bestVoice(lang){let vs=[];try{vs=speechSynthesis.getVoices()}catch(e){}const l2=lang.slice(0,2),reg=lang.slice(3).toUpperCase();
  const sc=v=>{const n=v.name||'',L=(v.lang||'').replace('_','-');if(!L.toLowerCase().startsWith(l2))return -99;let x=0;
    if(L.toUpperCase().endsWith(reg))x+=4;if(/natural|neural|premium|enhanced|erweitert|siri|online/i.test(n))x+=10;if(/google/i.test(n))x+=3;

  mc:{name:'Multiple Choice',icon:'☑️',txt:'Fragen mit Antworten zum Durchklicken, jede/r im eigenen Tempo. + richtig, − falsch.',fit:/übung|vertief|wiederhol|sicherung|überprüf/i,

  numline:{name:'Zahlenstrahl',icon:'📏',txt:'Zahlen oder Rechnungen auf dem Zahlenstrahl einordnen.',fit:/übung|vertief|wiederhol|warm|einstieg/i,

    parse:t=>{const L=akLines(t);let min=0,max=10,step=1;const m=(L[0]||'').match(/von\s*(-?[\d,.]+)\s*bis\s*(-?[\d,.]+)(?:.*schritt\s*([\d,.]+))?/i);

  say:{name:'Aussprach-Assistent',icon:'🎤',txt:'Wörter und Sätze anhören, nachsprechen, ELIO prüft die Aussprache. Für DaZ und Englisch.',fit:/sprech|ausspr|daz|vokabel|wort|übung|warm/i,

      if(a.k==='hear'){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(d.items[s.i]);u.lang=d.lang;u.rate=a.i==='slow'?.6:.85;
        const v=bestVoice(d.lang==='de-DE'?'de-DE':d.lang.slice(0,2)==='en'?'en-GB':d.lang);if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}return}
      if(a.k==='rec'){if(s.rec){sayStop(s);return}const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return;
        s.res=null;s.heard='';s.err='';const rc=new SR();rc.lang=d.lang;rc.interimResults=false;rc.maxAlternatives=3;s._rc=rc;s.rec=true;const at=s.i;
        rc.onresult=e=>{if(s.i!==at)return;const alts=[...e.results[0]].map(x=>x.transcript.trim());const target=d.items[s.i];
          // die beste der erkannten Varianten zählt
          let best=null;alts.forEach(h=>{const r=sayCheck(target,h,d.lang);if(!best||r.score>best.r.score)best={h,r}});
          s.heard=best.h;s.res=best.r;if(!s.done[s.i]){s.done[s.i]=1;if(best.r.level==='green')s.ok++}
          if(best.r.level==='green'){SND.right();s.done[s.i]=2}
          if(Object.keys(s.done).length>=d.items.length&&!s.win){s.win=true;s.msg=`${s.ok} von ${d.items.length} gleich beim ersten Mal sehr gut`}
          if(AK.st===s)render()};
        rc.onerror=e=>{s.err=e.error==='no-speech'?'Ich habe nichts gehört. Versuch es nochmal!':e.error==='not-allowed'?'Das Mikrofon ist nicht erlaubt. Bitte in den Einstellungen freigeben.':'Die Aufnahme hat nicht geklappt.';sayStop(s);if(AK.st===s)render()};
        rc.onend=()=>{if(s.rec){s.rec=false;if(AK.st===s)render()}};
        try{rc.start()}catch(e){s.rec=false}clearTimeout(s._t);s._t=setTimeout(()=>{if(s.rec){sayStop(s);if(AK.st===s)render()}},8000);return}}},
};

// Geteilte Stunden: SPLIT["d-i"]=[Fächer]; jede/r SuS wählt einmal die eigene Gruppe (S.mySubj)
let SPLIT={},SLOTS_RAW=null;
function applyWeek(sl){
  WEEK.forEach(r=>r.fill(null));SPLIT={};const by={};
  sl.forEach(x=>{if(WEEK[x.day]&&x.period<WEEK[x.day].length)(by[x.day+'-'+x.period]=by[x.day+'-'+x.period]||[]).push(x)});
  const mine=S.mySubj||[];
  Object.entries(by).forEach(([k,xs])=>{const [d,i]=k.split('-').map(Number);xs.sort((a,b)=>(a.grp||0)-(b.grp||0));
    const subs=[...new Set(xs.map(x=>x.subject))];if(subs.length>1)SPLIT[k]=subs;
    WEEK[d][i]=subs.find(x=>mine.includes(x))||subs[0]});
  TIMETABLE_EXAMPLE=false;
}
const splitSets=()=>{const m={};Object.values(SPLIT).forEach(a=>{const k=a.slice().sort().join('|');m[k]=a.slice().sort()});return Object.values(m)};
function splitPanel(onlyOpen){
  if(S.role!=='student')return '';
  const sets=splitSets(),mine=S.mySubj||[],open=sets.filter(a=>!a.some(x=>mine.includes(x)));
  const list=onlyOpen?open:sets;if(!list.length)return '';
  return `<section class="panel" style="margin-bottom:14px"><span class="label">Geteilter Unterricht</span><p style="font-weight:700;margin:4px 0 8px">${open.length?'Manche Stunden hat deine Klasse in Gruppen. Welche Gruppe ist deine?':'Deine Gruppen. Tippe, um sie zu ändern.'}</p>
    ${list.map(a=>`<div class="row" style="margin-top:6px">${a.map(x=>`<button class="btn sm ${mine.includes(x)?'on':''} s-${x}" data-act="my-subj" data-set="${a.join('|')}" data-s="${x}">${badge(x)} ${esc(SUBJECTS[x]?SUBJECTS[x].name:x)}</button>`).join('<span class="muted" style="font-weight:800">oder</span>')}</div>`).join('')}</section>`;
}
async function cloudLoadWeek(cid){

}
// Lehrkraft: eigener Stundenplan (alle Klassen), Wochenplanung, Stunden
async function cloudSync(){
  if(!Cloud.prof||Cloud.prof.role==='pending')return;
  const sb=Cloud.sb,uid=Cloud.user.id,ids=Cloud.myClasses.map(c=>c.id);
  try{
    const sl=ids.length?await q(sb.from('slots').select('class_id,day,period,subject,teacher_id,grp').in('class_id',ids)):[];
    TD.tt={};sl.filter(x=>x.teacher_id===uid).forEach(x=>{const c=Cloud.myClasses.find(k=>k.id===x.class_id);const split=sl.filter(y=>y.class_id===x.class_id&&y.day===x.day&&y.period===x.period).length>1;TD.tt[x.day+'-'+x.period]={s:x.subject,c:(c?c.name:'')+(split?' (Gruppe)':''),cid:x.class_id,g:x.grp||0}});ttOwnApply();TD.ttEx=false;
    const pl=ids.length?await q(sb.from('plans').select('class_id,date,period,lesson_id,teacher_id,grp').in('class_id',ids)):[];
    TD.plan={};pl.forEach(x=>{const t=TD.tt[((new Date(x.date+'T12:00').getDay()+6)%7)+'-'+x.period];if(t&&t.cid===x.class_id&&(t.g||0)===(x.grp||0))TD.plan[x.date+'|'+x.period]=x.lesson_id});tsave();
    const ls=await q(sb.from('lessons').select('id,owner,class_id,shared,data'));
    const planned=new Set(Object.values(TD.plan));
    // Die Demo-Stunde wandert nur in die Cloud, wenn sie verplant ist
    const mine=lessons().filter(L=>(!L.owner||L.owner===uid)&&!(L.id==='L-bsp'&&!ls.some(x=>x.id===L.id)&&!planned.has(L.id)));
    // Lokale Stunden beim ersten Login hochladen
    mine.forEach(L=>{if(!ls.some(x=>x.id===L.id)){if(L.id==='L-bsp'){const nid=lid();Object.keys(TD.plan).forEach(k=>{if(TD.plan[k]===L.id)TD.plan[k]=nid});L.id=nid}L.owner=uid;L.cid=L.cid||S.cls}});
    const fromCloud=ls.map(x=>Object.assign({},x.data,{id:x.id,owner:x.owner,cid:x.class_id,shared:x.shared}));
    const merged=fromCloud.concat(mine.filter(L=>!ls.some(x=>x.id===L.id)));
    S.lessons=merged;Cloud.sig={};ls.forEach(x=>{Cloud.sig[x.id]=JSON.stringify(lessonRow(fromCloud.find(L=>L.id===x.id)))});
    try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}cloudQueue();
  }catch(e){console.warn(e);Cloud.err='Sync fehlgeschlagen.'}
}
function lessonRow(L){const d=Object.assign({},L);['id','owner','cid','shared'].forEach(k=>delete d[k]);return {id:L.id,class_id:L.cid||null,subject:L.subject,title:L.title,data:d,shared:!!L.shared}}
let cloudT=null;
function cloudQueue(){
  if(!CLOUD||!Cloud.prof||Cloud.prof.role==='pending'||S.role!=='teacher')return;
  clearTimeout(cloudT);cloudT=setTimeout(async()=>{if(!Cloud.user||S.role!=='teacher')return;
    const uid=Cloud.user.id,rows=[];
    (S.lessons||[]).forEach(L=>{if(L.owner&&L.owner!==uid)return;L.owner=uid;const r=lessonRow(L),sg=JSON.stringify(r);if(Cloud.sig[L.id]!==sg){rows.push(r);Cloud.sig[L.id]=sg}});
    if(rows.length){try{await q(Cloud.sb.from('lessons').upsert(rows))}catch(e){console.warn(e);rows.forEach(r=>delete Cloud.sig[r.id])}}
  },1200);
}
async function cloudDelLesson(id){if(!CLOUD||!Cloud.prof)return;try{await q(Cloud.sb.from('lessons').delete().eq('id',id));delete Cloud.sig[id]}catch(e){}}
async function cloudPlan(d,i,date,lessonId){if(!CLOUD||!Cloud.prof)return;const t=TD.tt[d+'-'+i];if(!t||!t.cid)return;
  clearTimeout(cloudT);const L=lessonById(lessonId);if(L){L.cid=L.cid||t.cid;await new Promise(r=>setTimeout(r,0))}
  try{if(L){const r=lessonRow(L);await q(Cloud.sb.from('lessons').upsert([r]));Cloud.sig[L.id]=JSON.stringify(r)}
    await q(Cloud.sb.from('plans').upsert([{class_id:t.cid,date,period:i,grp:t.g||0,lesson_id:lessonId}]))}catch(e){console.warn(e)}}
async function cloudUnplan(k){if(!CLOUD||!Cloud.prof)return;const [date,i]=k.split('|'),d=(new Date(date+'T12:00').getDay()+6)%7,t=TD.tt[d+'-'+i];if(!t||!t.cid)return;

async function lgIn(up){
  const em=($('#lg-mail').value||'').trim(),pw=$('#lg-pw').value||'';
  if(!/\S+@\S+\.\S+/.test(em)||pw.length<8){V.err='Bitte E-Mail und ein Passwort mit mindestens 8 Zeichen eingeben.';V.msg='';render();return}
  const sb=await sbClient();
  const r=up?await sb.auth.signUp({email:em,password:pw,options:{emailRedirectTo:location.origin+location.pathname}}):await sb.auth.signInWithPassword({email:em,password:pw});
  if(r.error){V.err=up?'Konto konnte nicht erstellt werden: '+r.error.message:'Anmelden hat nicht geklappt. Stimmen E-Mail und Passwort?';V.msg='';render();return}
  if(up&&!r.data.session){V.err='';V.msg='Fast geschafft: Bestätige den Link in deiner E-Mail und melde dich dann hier an.';render();return}
  Cloud.user=r.data.user;V.err='';V.msg='';await cloudLoadMe();
  if(V.asAdmin&&Cloud.prof&&Cloud.prof.role==='admin'){S.role='teacher';saveRole();if(!CS)initTeacher();A.ok=false;go('admin');return}
  if(Cloud.myClasses.length===1&&Cloud.prof.role==='teacher'){await teacherEnter(Cloud.myClasses[0]);return}
  render();
}

async function heftLoadPlan(quiet,sk){sk=PLANS[sk]?sk:'M';const PL=PLANS[sk];try{const [L,M]=await Promise.all([PL.f,PL.f+'_mod'].map(f=>fetch('assets/heft/'+f+'.json').then(r=>r.json())));TD.heft=TD.heft||[];TD.modx={...(TD.modx||{}),...M};let n=0;

/* ---------- Schüler ↔ Lehrkraft: Abgaben, Chat und Lernstand ----------
   Alles ist Ende-zu-Ende verschlüsselt: SuS verschlüsseln mit dem öffentlichen Schlüssel der Lehrkraft,
   die Lehrkraft antwortet mit dem öffentlichen Schlüssel des iPads. Der Server (supabase/mail.sql) sieht nur Zeichensalat.

const MB={cloud:null,busy:false,tbusy:false};

  catch(e){if(mbMissing(e))CC.miss=true;else console.warn('ccPush',e)}},2000)}

    const L=await q(sb.from('class_content').select('body').eq('class_id',S.cls).limit(1));if(!L.length)return;const o=await ckOpen(k,L[0].body);if(o&&o.t==='content')applyContent(liveClean(o.p))}
  catch(e){if(mbMissing(e))CC.miss=true}}
// Bilder der Folien für die iPads (supabase/media.sql): verkleinert, mit dem Klassenschlüssel verschlüsselt, pro Klasse abgelegt.

const MED={up:{},miss:false,neg:{}};
function lessonMedia(L){const ids=new Set(),bg=b=>{if(b&&b!=='none'&&!SL_BG[b])ids.add(b)};(L&&L.phases||[]).forEach(p=>{const t=p.tool||{};bg(t.bg);[...(p.xs||[]),...(t.slides||[])].forEach(sl=>{if(!sl)return;bg(sl.bg);(sl.imgs||[]).forEach(m=>m&&m.id&&ids.add(m.id))})});return [...ids]}
async function medSmall(b){try{const bm=await createImageBitmap(b),f=Math.min(1,1600/Math.max(bm.width,bm.height)),cv=document.createElement('canvas');cv.width=Math.round(bm.width*f);cv.height=Math.round(bm.height*f);cv.getContext('2d').drawImage(bm,0,0,cv.width,cv.height);
  const o=await new Promise(r=>cv.toBlob(r,'image/webp',.82));return o&&o.size<b.size?o:b}catch(e){return b}}
let medT=0;function mediaPush(){if(S.role!=='teacher'||!CS||!ccOk()||MED.miss)return;const L=CS.lesson&&lessonById(CS.lesson.id);if(!L)return;clearTimeout(medT);medT=setTimeout(async()=>{const k=myCk(S.code);if(!k)return;const done=MED.up[S.cls]||(MED.up[S.cls]={});
  for(const id of lessonMedia(L)){if(done[id])continue;try{const b=await idb('blob','readonly',st=>st.get(id));if(!b){done[id]=1;continue}const sm=await medSmall(b),iv=crypto.getRandomValues(new Uint8Array(12));

    const sb=await sbClient();await q(sb.from('class_media').upsert({class_id:S.cls,id:String(id).slice(0,80),body:{iv:b64e(iv),ct:b64e(ct),ty:sm.type||'image/webp'},updated_at:new Date().toISOString()}));done[id]=1}
  catch(e){if(mbMissing(e)){MED.miss=true;return}console.warn('mediaPush',e)}}},1500)}
async function mediaGet(id){if(S.role!=='student'||!ccOk()||MED.miss||(MED.neg[id]&&Date.now()-MED.neg[id]<8000))return null;
  try{const sb=await sbClient(),k=myCk(S.code);if(!k)return null;const L=await q(sb.from('class_media').select('body').eq('class_id',S.cls).eq('id',String(id).slice(0,80)).limit(1));if(!L.length){MED.neg[id]=Date.now();return null}
    const e=L[0].body,pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(e.iv)},await ckImp(k),b64d(e.ct)),ty=/^image\/(webp|png|jpeg|gif)$/.test(e.ty)?e.ty:'image/webp',b=new Blob([pt],{type:ty});

async function mbUp(r){if(!TDKEY||!TD.dk||!r||!r.body||r.fp!==mbFp(TD.dk.pub))return false;const nr=+r.nr;if(!(nr>=1&&nr<=40))return false;

/* ---------- Persönlicher Zugang: Kürzel (4 Buchstaben) + PIN (4 Ziffern) ----------
   Server prüft die PIN (bcrypt, Sperre nach Fehlversuchen) und bindet das iPad an die Klasse.
   Avatar, Name und Lernstand liegen als verschlüsselte Sicherung daneben, Schlüssel aus Kürzel und PIN. */
const ACCT_KEYS=MINE.filter(k=>!['progSig','progAt','mbq','phaseSeen','gameSeen','shareSeen','qzSeen'].includes(k));
const cleanU=v=>String(v||'').toUpperCase().replace(/[^A-Z]/g,'').slice(0,4),cleanPin=v=>String(v||'').replace(/\D/g,'').slice(0,4);
const ACCT={busy:false,t:0,sig:'',k:null,kfor:''};
async function acctKey(u,p){if(ACCT.k&&ACCT.kfor===u+p)return ACCT.k;const C=crypto.subtle,km=await C.importKey('raw',new TextEncoder().encode('elio-acct:'+u+':'+p),'PBKDF2',false,['deriveKey']);
  ACCT.k=await C.deriveKey({name:'PBKDF2',salt:new TextEncoder().encode('elio-acct-salt:'+u),iterations:200000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);ACCT.kfor=u+p;return ACCT.k}
async function acctSeal(u,p,o){const iv=crypto.getRandomValues(new Uint8Array(12)),ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},await acctKey(u,p),new TextEncoder().encode(JSON.stringify(o)));return {v:1,iv:b64e(iv),ct:b64e(ct)}}
async function acctOpen(u,p,e){return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(e.iv)},await acctKey(u,p),b64d(e.ct))))}
function acctSnap(){const o={};ACCT_KEYS.forEach(k=>{if(k in S)o[k]=S[k]});if(Array.isArray(o.chat)&&o.chat.length>150)o.chat=o.chat.slice(-150);return o}
// Sicherung hochladen: höchstens alle 20 Sekunden und nur, wenn sich etwas geändert hat
function acctSave(force){if(S.role!=='student'||!S.acct||!CLOUD)return;clearTimeout(ACCT.t);ACCT.t=setTimeout(acctFlush,force?200:20000)}
async function acctFlush(){if(ACCT.busy||S.role!=='student'||!S.acct)return;const snap=acctSnap(),sig=JSON.stringify(snap),{u,p}=S.acct;if(sig===ACCT.sig)return;ACCT.busy=true;
  try{const sb=await sbClient();S.acctAt=Date.now();const body=await acctSeal(u,p,{...snap,acctAt:S.acctAt});if(JSON.stringify(body).length>390000)throw new Error('zu groß');
    const r=await q(sb.rpc('pupil_prof_save',{p_uname:u,p_pin:p,p_prof:body}));if(r==='ok'){ACCT.sig=sig;save()}else if(r==='wrong'){ACCT.bad=1}}catch(e){console.warn('acct',e)}ACCT.busy=false}
async function acctAnon(sb){let {data}=await sb.auth.getSession();if(!data.session||!data.session.user.is_anonymous){if(data.session)await sb.auth.signOut();await sb.auth.signInAnonymously();({data}=await sb.auth.getSession())}Cloud.anon=data.session&&data.session.user;return Cloud.anon}
const ACCT_ERR={wrong:'Kürzel oder PIN stimmt nicht.',wait:'Zu viele falsche Versuche. Warte 10 Minuten und versuch es dann nochmal.',blocked:'Dieser Zugang ist gesperrt. Deine Lehrkraft kann dir eine neue PIN geben.',auth:'Anmeldung am Server ging nicht. Versuch es gleich nochmal.'};
async function acctLogin(u,p,quiet){u=cleanU(u);p=cleanPin(p);if(u.length!==4||p.length!==4){V.err='Das Kürzel hat 4 Buchstaben, die PIN 4 Ziffern.';render();return}

    if(!r||r.err){if(quiet)return false;V.busy=0;V.err=r&&/function|schema/i.test(String(r.err))?'Die persönlichen Zugänge sind noch nicht eingerichtet.':ACCT_ERR[r&&r.err]||ACCT_ERR.wrong;V.step='join';render();return false}
    const c={id:r.id,school_id:r.school_id,school_name:r.school_name,name:r.name,size:r.size,code:r.code};JOINED=c;addJoined();
    if(quiet)return true;

    // Sicherung vom Server: übernehmen, wenn sie neuer ist als das, was auf diesem iPad liegt
    if(r.prof&&r.prof.ct){try{const o=await acctOpen(u,p,r.prof);if(o&&o.wipe&&(+S.nickAt||0)<+o.wipe){const pk=S.pk,tpk=S.tpk;meClear();if(pk)S.pk=pk;if(tpk)S.tpk=tpk}else if(o&&(+o.acctAt||0)>=(+S.acctAt||0))ACCT_KEYS.concat('acctAt').forEach(k=>{if(k in o)S[k]=o[k]})}catch(e){console.warn('acct open',e)}}
    S.acct={u,p};S.phaseSeen='';V.busy=0;ACCT.sig='';S.inAt=Date.now();S.lastAct=Date.now();S.locked=false;
    if(!S.nick||S.av==null){V.nr=S.nr;V.only='student';V.step='nick';V.av=null;saveRole();render();return true}
    saveRole();Live.start(S.code);go('dash');setTimeout(()=>sendMsg({k:'hi'}),300);mbQueue({k:'hi',at:Date.now()});acctSave(true);cloudLoadWeek(S.cls).then(render);return true}
  catch(e){if(quiet)return false;V.busy=0;V.err=/pupil_login|function|schema|404|PGRST202/i.test(String(e&&(e.message||e.code)))?'Die persönlichen Zugänge sind noch nicht eingerichtet. Melde dich mit Klassencode an.':'ELIO ist gerade nicht erreichbar. Versuch es gleich nochmal.';V.step='join';render();return false}}
// Lehrkraft: Zugänge der Klasse verwalten. PINs liegen nur im Lehrer-Tresor (zum Nachdrucken).
const ZG={list:null,err:'',busy:false,cid:null};
const ZG_C='BDFGKLMNPRSTWZ',ZG_V='AEIOU',ZG_BAD=/^(NAZI|PENI|KAKA|PIPI|POPO|TOTE|MOFO|NUTE|SAFE|FOTZ|FICK)$/;
function zgUname(){let u;do{u=Math.random()<.85?[ZG_C,ZG_V,ZG_C,ZG_V].map(x=>x[Math.floor(Math.random()*x.length)]).join(''):Array.from({length:4},()=>'ABDEFGHKLMNPRSTUWZ'[Math.floor(Math.random()*18)]).join('')}while(ZG_BAD.test(u));return u}
function zgPin(){let p;do{p=String(Math.floor(Math.random()*10000)).padStart(4,'0')}while(/^(\d)\1{3}$|^(0123|1234|2345|3456|4567|5678|6789|9876|8765|7654|4321|1212|2000|2020|1111)$/.test(p));return p}
const zgStore=cid=>{TD.logins=TD.logins||{};return TD.logins[cid]||(TD.logins[cid]={})};
async function zgLoad(cid){ZG.cid=cid;ZG.err='';try{ZG.list=await q(Cloud.sb.rpc('pupil_login_list',{p_class:cid}));if(TDKEY&&Array.isArray(ZG.list)){TD.unames=TD.unames||{};const m={};ZG.list.forEach(x=>{if(x&&x.uname)m[x.nr]=String(x.uname).slice(0,8)});TD.unames[cid]=m;tsave()}}catch(e){ZG.list=[];ZG.err=/pupil_login|function|schema|PGRST202/i.test(String(e.message||e.code))?'missing':(e.message||String(e))}render()}
async function zgSet(cid,nr,u){const st=zgStore(cid);for(let i=0;i<8;i++){const un=u||zgUname(),pin=zgPin();const r=await q(Cloud.sb.rpc('pupil_login_set',{p_class:cid,p_nr:nr,p_uname:un,p_pin:pin}));
    if(r==='ok'){st[nr]={u:un,p:pin,at:Date.now()};tsave();return true}if(r!=='taken')throw new Error(r);u=null}return false}
async function zgDo(f){if(ZG.busy)return;ZG.busy=true;render();try{await f()}catch(e){ZG.err=e.message||String(e)}ZG.busy=false;await zgLoad(ZG.cid)}

async function cttSave(key){
