<title>ELIO</title>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: iPad-first app shell. Sticky header with clock and nav; dashboard = "Jetzt"-card + Fächer-grid; each subject has Heft / Hausaufgaben / Module. */
:root{
  --bg:#eef1f8; --surface:#ffffff; --surface-2:#f5f7fc; --ink:#18203d; --muted:#586082; --line:#d8ddee;
  --navy:#26337a; --red:#cf3a2c; --yellow:#f2b51d; --green:#1f8f5d; --blue:#2f6fd6; --orange:#e8743b;
  --on-accent:#ffffff; --on-bright:#18203d; --ok-bg:#dff4e9; --warn-bg:#fdf0d2; --late-bg:#fde3df;
  --f-display:"Baloo 2","Arial Rounded MT Bold",ui-rounded,system-ui,sans-serif;
  --f-body:"Nunito",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:18px;
  --shadow:0 2px 0 rgba(24,32,61,.07),0 10px 24px rgba(24,32,61,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1328; --surface:#181e3c; --surface-2:#1f274a; --ink:#eef0fa; --muted:#a4acce; --line:#2e3768;
  --navy:#a3b3ff; --red:#ff7b6c; --yellow:#ffcb47; --green:#4fd394; --blue:#7fabff; --orange:#ff9a62;
  --on-accent:#0f1328; --ok-bg:#173a2d; --warn-bg:#3a3017; --late-bg:#45201d;
  --shadow:0 2px 0 rgba(0,0,0,.25),0 10px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1328; --surface:#181e3c; --surface-2:#1f274a; --ink:#eef0fa; --muted:#a4acce; --line:#2e3768;
  --navy:#a3b3ff; --red:#ff7b6c; --yellow:#ffcb47; --green:#4fd394; --blue:#7fabff; --orange:#ff9a62;
  --on-accent:#0f1328; --ok-bg:#173a2d; --warn-bg:#3a3017; --late-bg:#45201d;
  --shadow:0 2px 0 rgba(0,0,0,.25),0 10px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:var(--f-display);line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:clamp(1.6rem,3.4vw,2.3rem)} h2{font-size:clamp(1.3rem,2.6vw,1.7rem)} h3{font-size:1.2rem}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:2px;background:none;border:0;padding:0;cursor:pointer;font-family:var(--f-display);font-weight:800;font-size:1.7rem;line-height:1;letter-spacing:.02em}
.logo .on{display:inline-flex;align-items:center;gap:5px;background:var(--green);color:var(--on-accent);border-radius:999px;padding:2px 4px 0 11px}
.logo .on i{width:18px;height:18px;border-radius:50%;background:var(--on-accent);display:inline-block;margin-top:-2px}
.nav{display:flex;gap:6px;flex-wrap:wrap}
.nav button{border:0;background:none;padding:8px 12px;border-radius:12px;font-weight:800;cursor:pointer;color:var(--muted);min-height:42px}
.nav button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.spacer{flex:1}
.clock{font-family:var(--f-display);font-weight:800;font-size:1.25rem;font-variant-numeric:tabular-nums}
.clock.sim{color:var(--orange)}
.stars{display:flex;align-items:center;gap:6px;font-weight:800;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-variant-numeric:tabular-nums}
.stars svg{width:20px;height:20px}

main{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:20px 48px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-weight:800;cursor:pointer;touch-action:manipulation;transition:transform .08s}
.btn svg{width:20px;height:20px;flex:none}
.btn:active{transform:translateY(2px)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:var(--on-accent)}
.btn.ok{background:var(--green);border-color:var(--green);color:var(--on-accent)}
.btn.red{background:var(--red);border-color:var(--red);color:var(--on-accent)}
.btn.sm{min-height:40px;padding:6px 12px;font-size:.9rem;border-radius:12px}
.btn[disabled]{opacity:.45;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-size:.8rem;font-weight:800;letter-spacing:.02em;color:var(--muted)}
.chip.ex{border-style:dashed;color:var(--orange);border-color:var(--orange)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.muted{color:var(--muted)}
.label{font-size:.75rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.empty{padding:22px;border:2px dashed var(--line);border-radius:16px;text-align:center;color:var(--muted);font-weight:700}

/* Subject colours: fixed, white text works in both themes */
.s-WK{--sc:#b0521a}.s-ES{--sc:#c2477f}.s-T{--sc:#55606e}.s-S{--sc:#1f8f4e}.s-GS{--sc:#8d6b12}.s-ET{--sc:#5b57b8}.s-R{--sc:#7a4a2a}.s-GD{--sc:#3d6f8f}
.s-E{--sc:#c8402f}.s-M{--sc:#2f63c8}.s-K{--sc:#8a4fc1}.s-D{--sc:#0e8577}.s-G{--sc:#a8650f}.s-N{--sc:#3f8a2b}.s-I{--sc:#4a5d78}.s-W{--sc:#c03a74}
.sbadge{flex:none;width:44px;height:44px;border-radius:12px;background:var(--sc);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.05rem}

/* Dashboard */
.dash{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:820px){.dash{grid-template-columns:1fr}}
.now{border-radius:22px;padding:22px;background:var(--sc,var(--navy));color:#fff;box-shadow:var(--shadow);position:relative;overflow:hidden}
.now.idle{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.now .k{font-size:.8rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.now h2{font-size:clamp(2rem,5vw,3rem);margin-block:2px 4px;padding-right:70px}
.now .bar{height:10px;border-radius:10px;background:rgba(255,255,255,.3);margin-top:14px;overflow:hidden}
.now .bar i{display:block;height:100%;background:#fff}
.now .btn{border-color:#fff;background:#fff;color:#18203d}
.now .btn.ghost{background:transparent;color:#fff}
.now .elo{position:absolute;right:14px;top:14px}
.today{display:grid;gap:6px;margin-top:10px}
.slot-row{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:12px}
.slot-row.cur{background:var(--surface-2);box-shadow:inset 0 0 0 2px var(--sc)}
.slot-row.past{opacity:.5}
.slot-row .sbadge{width:34px;height:34px;font-size:.85rem;border-radius:10px}
.slot-row .tm{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:700;width:104px;flex:none;font-size:.9rem}
.subj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,170px),1fr));gap:12px;margin-top:10px}
.subj{display:flex;flex-direction:column;gap:10px;text-align:left;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);cursor:pointer;border-top:6px solid var(--sc)}
.subj b{font-family:var(--f-display);font-size:1.2rem;line-height:1.1}
.subj small{color:var(--muted);font-weight:700;display:block}
.mini{height:8px;border-radius:8px;background:var(--surface-2);overflow:hidden}
.mini i{display:block;height:100%;background:var(--sc)}
.hw-list{display:grid;gap:8px;margin-top:10px}
.hw{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.hw .sbadge{width:36px;height:36px;font-size:.85rem;border-radius:10px}
.hw .tx{flex:1;min-width:0}
.hw .tx b{display:block}
.hw.done .tx{opacity:.55;text-decoration:line-through}
.due{display:inline-block;font-size:.8rem;font-weight:800;padding:1px 8px;border-radius:8px;background:var(--surface-2);color:var(--muted)}
.due.soon{background:var(--warn-bg);color:var(--ink)}
.due.late{background:var(--late-bg);color:var(--red)}
.check{flex:none;width:40px;height:40px;border-radius:12px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;font-weight:800}
.check.on{background:var(--green);border-color:var(--green);color:var(--on-accent)}

/* Subject page */
.subj-head{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.subj-head .sbadge{width:56px;height:56px;font-size:1.3rem;border-radius:16px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:2px solid var(--line);margin-bottom:16px}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:800;cursor:pointer;color:var(--muted);border-bottom:4px solid transparent;margin-bottom:-2px;min-height:46px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--sc)}

/* Heft: looks like a real exercise-book page */
.entries{display:grid;gap:16px}
.page{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:6px 16px 16px 6px;box-shadow:var(--shadow);padding:20px 20px 18px 34px;min-width:0;
  background-image:repeating-linear-gradient(to bottom,transparent 0 31px,color-mix(in srgb,var(--blue) 14%,transparent) 31px 32px);background-position:0 54px}
.page::before{content:"";position:absolute;left:20px;top:0;bottom:0;width:2px;background:color-mix(in srgb,var(--red) 55%,transparent)}
.page header{display:flex;gap:10px;align-items:baseline;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px}
.page h3{font-size:1.45rem;text-decoration:underline;text-decoration-color:var(--sc);text-decoration-thickness:3px;text-underline-offset:5px}
.page .date{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:800}
.page h4{font-family:var(--f-display);font-size:1.1rem;margin:14px 0 4px;color:var(--sc)}
.page ul{margin:4px 0;padding-left:22px}
.page li{margin-block:2px}
.merke{margin-block:12px;border:3px solid var(--sc);border-radius:12px;padding:10px 14px;background:var(--surface)}
.merke b.l{font-family:var(--f-display);color:var(--sc)}
.tbl{overflow-x:auto;margin-block:8px}
.tbl table{border-collapse:collapse;min-width:280px;background:var(--surface)}
.tbl td,.tbl th{border:1px solid var(--line);padding:6px 12px;text-align:left}
.tbl th{background:var(--surface-2)}
.page footer{margin-top:14px;display:flex;justify-content:flex-end}

/* English module (Lernleiter) */
.home{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px;align-items:start}
@media (max-width:760px){.home{grid-template-columns:1fr}}
.hello{display:flex;gap:14px;align-items:flex-start}
.hello svg{flex:none}
.bubble{position:relative;background:var(--surface-2);border:1px solid var(--line);border-radius:16px;padding:12px 14px;font-weight:700}
.mission{margin-top:16px;border:2px dashed var(--yellow);border-radius:16px;padding:14px;background:var(--warn-bg)}
.mission p{font-family:var(--f-display);font-size:1.35rem;line-height:1.2;margin-top:4px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;margin-top:10px}
.pc{aspect-ratio:3/2;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.72rem;font-weight:800;text-align:center;border:2px solid var(--line);background:var(--surface-2);color:var(--muted);padding:4px}
.pc span{font-size:1.7rem;line-height:1.2}
.pc.on{background:var(--surface);border-color:var(--red);color:var(--ink);box-shadow:inset 0 0 0 3px var(--surface),inset 0 0 0 5px var(--red)}
.pc.off span{filter:grayscale(1);opacity:.35}
.ladder{display:flex;flex-direction:column-reverse;position:relative;padding-inline:26px}
.ladder::before,.ladder::after{content:"";position:absolute;top:0;bottom:0;width:8px;border-radius:8px;background:var(--navy);opacity:.9}
.ladder::before{left:8px}.ladder::after{right:8px}
.rung{position:relative;display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;margin-block:6px;background:var(--surface);border:2px solid var(--line);border-radius:14px;cursor:pointer;box-shadow:var(--shadow);min-height:66px}
.rung .n{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.15rem;background:var(--surface-2);border:2px solid var(--line)}
.rung.done{border-color:var(--green)}
.rung.done .n{background:var(--green);border-color:var(--green);color:var(--on-accent)}
.rung.next{border-color:var(--yellow);box-shadow:0 0 0 4px color-mix(in srgb,var(--yellow) 35%,transparent)}
.rung .t{flex:1;min-width:0}
.rung .t b{display:block;font-family:var(--f-display);font-size:1.12rem;line-height:1.15}
.rung .t small{display:block;color:var(--muted);font-weight:700}
.rung .climber{position:absolute;right:-6px;top:-22px}
.ladder-top{text-align:center;font-family:var(--f-display);font-weight:800;color:var(--red);margin-bottom:6px}
.mod-card{display:flex;gap:14px;align-items:center;text-align:left;width:100%;padding:16px;border-radius:16px;border:2px solid var(--line);background:var(--surface);box-shadow:var(--shadow);cursor:pointer}
.mod-card svg{flex:none}
.mod-card .t{flex:1;min-width:0}
.mod-card b{font-family:var(--f-display);font-size:1.3rem;display:block}

.st-head{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.goal{display:flex;gap:10px;align-items:center;background:var(--ok-bg);border-radius:14px;padding:10px 14px;font-weight:800;margin-bottom:16px}
.goal .label{color:var(--green)}
.say{display:flex;gap:12px;align-items:center;margin-block:10px}
.say svg{flex:none}
.prog{height:12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--green);border-radius:12px;transition:width .3s}
.big-card{text-align:center;padding:28px 18px;border-radius:22px;background:var(--surface);border:3px solid var(--navy);box-shadow:var(--shadow)}
.big-word{font-family:var(--f-display);font-size:clamp(2.4rem,9vw,4.8rem);line-height:1;margin-block:8px}
.taboo{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.taboo span{padding:6px 12px;border-radius:10px;background:var(--surface-2);border:2px solid var(--red);color:var(--red);font-weight:800;text-decoration:line-through}
.choice-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px}
.choice{padding:18px;border-radius:16px;border:2px solid var(--line);background:var(--surface);text-align:left;cursor:pointer;box-shadow:var(--shadow)}
.choice b{font-family:var(--f-display);font-size:1.3rem;display:block}
.opts{display:grid;gap:10px;margin-top:16px}
.opt{min-height:58px;font-size:1.2rem}
.opt.right{background:var(--green);border-color:var(--green);color:var(--on-accent)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
.pop{animation:pop .3s}
@keyframes pop{50%{transform:scale(1.05)}}
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.match{grid-template-columns:1fr}}
.match .col{display:grid;gap:10px;align-content:start}
.mbtn{justify-content:flex-start;text-align:left;min-height:60px}
.mbtn.sel{border-color:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 30%,transparent)}
.mbtn.ok{background:var(--ok-bg);border-color:var(--green);opacity:.75}
.dlg{display:grid;gap:8px}
.line{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:14px;border:2px solid var(--line);background:var(--surface)}
.who{flex:none;width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;font-weight:800;font-size:.85rem;color:var(--on-accent)}
.who.A{background:var(--blue)}.who.B{background:var(--red)}
.line .tx{flex:1;min-width:0;font-weight:700;font-size:1.08rem}
.line.mine{border-color:var(--yellow);background:var(--warn-bg)}
.line.theirs .tx{color:var(--muted)}
.line .de{font-style:italic}
.ear{color:var(--muted);font-weight:800}
.gap{display:inline-block;min-width:70px;border:0;border-bottom:3px dotted var(--navy);background:none;padding:0 4px;font-weight:800;color:var(--navy);cursor:pointer}
.gap.shown{border-bottom-style:solid}
.icon-btn{flex:none;width:40px;height:40px;border-radius:12px;border:2px solid var(--line);background:var(--surface-2);display:grid;place-items:center;cursor:pointer}
.icon-btn svg{width:20px;height:20px}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:560px){.steps{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stepb{flex-direction:column;gap:0;min-height:62px;line-height:1.1}
.stepb small{font-weight:700;color:var(--muted)}
.stepb.on{border-color:var(--navy);background:var(--surface-2);box-shadow:inset 0 -4px 0 var(--navy)}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:14px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:10px 14px;font-weight:800;cursor:pointer;min-height:46px}
.seg button.on{background:var(--navy);color:var(--on-accent)}
.rolecards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px}
.rolecard{border-radius:18px;padding:18px;border:3px solid var(--line);background:var(--surface)}
.rolecard.A{border-color:var(--blue)}.rolecard.B{border-color:var(--red)}
.rolecard ul{margin:8px 0 0;padding-left:20px;font-weight:700}
.rolecard.dim{opacity:.4}
.pool{display:grid;gap:8px}
.slot{min-height:52px;border:2px dashed var(--line);border-radius:14px;display:flex;align-items:center;padding:8px 12px;color:var(--muted);font-weight:700}
.corners{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.corner{min-height:120px;border-radius:18px;border:0;padding:14px;text-align:left;cursor:pointer;color:var(--on-bright);font-weight:800;display:flex;flex-direction:column;justify-content:space-between}
.corner b{font-family:var(--f-display);font-size:1.5rem}
.c1{background:#ffd95e}.c2{background:#ffb57d}.c3{background:#8fe0b5}.c4{background:#9cc2ff}
[hidden]{display:none!important}
textarea,input[type=text],input[type=url],input[type=search],input[type=number],input[type=time],input[type=password],select{font:inherit;width:100%;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}

/* Week */
.wk{overflow-x:auto}
.wk table{border-collapse:separate;border-spacing:6px;min-width:640px;width:100%}
.wk th{font-family:var(--f-display);text-align:left;color:var(--muted);font-size:.95rem}
.wk td{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-weight:800;height:52px;vertical-align:middle}
.wk td.has{background:var(--sc);color:#fff;border-color:var(--sc)}
.wk td.cur{box-shadow:0 0 0 3px var(--yellow)}
.wk td.tm{background:none;border:0;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums;font-size:.85rem;white-space:nowrap}

/* Board */
.board{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.board > *{grid-column:span 6}
.board .wide{grid-column:span 12}
@media (max-width:820px){.board > *{grid-column:span 12}}
.timer{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.ring{--p:1;width:170px;height:170px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--navy) calc(var(--p)*360deg),var(--surface-2) 0);flex:none}
.ring div{width:138px;height:138px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--f-display);font-size:2.6rem;font-weight:800;font-variant-numeric:tabular-nums}
.sig{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sig .btn{min-height:76px;flex-direction:column;gap:2px;line-height:1.1}
.sig .btn small{font-weight:700;opacity:.8}
.pairs{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.pairs span{padding:6px 12px;border-radius:12px;background:var(--surface-2);border:2px solid var(--line);font-weight:800;font-variant-numeric:tabular-nums}
.rocket{display:flex;gap:16px;align-items:flex-end}
.fuel{display:flex;flex-direction:column-reverse;gap:4px;width:44px;flex:none}
.fuel i{height:16px;border-radius:5px;background:var(--surface-2);border:1px solid var(--line)}
.fuel i.on{background:var(--orange);border-color:var(--orange)}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px;margin-top:12px}
.lib article{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--surface-2);min-width:0}
.lib article h3{font-size:1.1rem;margin-bottom:4px}
.lib .tag{font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--red)}
.jobs{display:grid;gap:8px;margin-top:10px}
.jobs div{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 12px;border-radius:12px;background:var(--surface-2)}
.jobs b{font-variant-numeric:tabular-nums;font-family:var(--f-display);font-size:1.2rem}

/* Overlay */
.ov{position:fixed;inset:0;z-index:20;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px}
.ov[hidden]{display:none}
.ov .box{max-width:460px;width:100%;text-align:center;background:var(--surface);border-radius:24px;border:3px solid var(--yellow);padding:24px;box-shadow:var(--shadow);animation:pop .4s;max-height:100%;overflow:auto}
.ov .box.change{border-color:var(--sc);text-align:left}
.ov .post{font-size:4rem;line-height:1.1}
.prep{display:grid;gap:8px;margin-top:12px}
.prep button{display:flex;gap:12px;align-items:center;text-align:left;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--surface-2);font-weight:800;cursor:pointer;min-height:52px}
.prep button i{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;font-style:normal}
.prep button.on i{background:var(--green);border-color:var(--green);color:var(--on-accent)}
.saved{margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--ok-bg);font-weight:700}
.foot{margin-top:28px;font-size:.85rem;color:var(--muted);text-align:center}
/* Live banner (students) */
#live{border-top:1px solid var(--line);background:var(--surface)}
.live-in{max-width:1180px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dot{flex:none;width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px color-mix(in srgb,var(--green) 25%,transparent)}
.dot.off{background:var(--muted);box-shadow:none}
.ph-txt{color:var(--muted);font-weight:700;min-width:0}
.ltimer{font-family:var(--f-display);font-weight:800;font-size:1.3rem;font-variant-numeric:tabular-nums}
.lov{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:16px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(8px)}
.lov[hidden]{display:none}
.lov .box{max-width:480px;width:100%;background:var(--surface);border-radius:24px;border:3px solid var(--navy);padding:24px;box-shadow:var(--shadow);animation:pop .4s;max-height:100%;overflow:auto}
.lov.full{background:var(--surface)}
.look{text-align:center;display:grid;justify-items:center;gap:8px}
.look h1{font-size:clamp(3rem,10vw,6rem)}
.look p{font-size:1.4rem;font-weight:800;color:var(--muted)}
.opt.c1,.opt.c2,.opt.c3,.opt.c4{color:var(--on-bright);border-color:transparent}

/* Start screen */
.splash{min-height:70vh;display:grid;place-content:center;justify-items:center;gap:18px;text-align:center}
.biglogo{display:flex;align-items:center;gap:6px;font-family:var(--f-display);font-weight:800;font-size:clamp(4rem,14vw,8rem);line-height:1;letter-spacing:.02em}
.biglogo .on{display:inline-flex;align-items:center;gap:.14em;background:var(--green);color:var(--on-accent);border-radius:999px;padding:.06em .1em 0 .32em}
.biglogo .on i{width:.62em;height:.62em;border-radius:50%;background:var(--on-accent);display:inline-block;margin-top:-.08em}
.tagline{font-size:1.2rem;font-weight:800;color:var(--muted);letter-spacing:.04em}
.btn.big{min-height:64px;padding:12px 40px;font-size:1.3rem;border-radius:18px}
.start{max-width:860px;margin:0 auto}
.start-head{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:12px;margin-top:16px}
.pick-card{display:flex;flex-direction:column;gap:4px;text-align:left;padding:20px;border-radius:18px;border:2px solid var(--line);background:var(--surface);box-shadow:var(--shadow);cursor:pointer;font-weight:700}
.pick-card b{font-family:var(--f-display);font-size:1.4rem;line-height:1.1}
.pick-card b.cl{font-size:3rem;color:var(--navy)}
.pick-card:hover{border-color:var(--navy)}
/* Role screen */
.role-wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:18px;margin-top:16px}
.numgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:8px;margin-top:10px}
.numgrid .btn{min-height:56px;font-family:var(--f-display);font-size:1.3rem;padding:0}
.err{color:var(--red);font-weight:800;margin-top:8px}

/* Tafel (teacher dashboard for Apple TV) */
.tafel{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px;align-items:start}
.t-head{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center}
@media (max-width:820px){.tafel,.t-head{grid-template-columns:1fr}}
.t-big{font-size:clamp(2.4rem,5vw,4rem)}
.t-txt{font-size:1.3rem;font-weight:700;color:var(--muted);margin-top:4px}
.t-side{display:grid;gap:16px;min-width:0}
.seats{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:12px}
.seat{min-height:78px;border-radius:14px;border:2px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 4px;font-family:var(--f-display);font-weight:800;font-size:1.25rem;color:var(--muted);position:relative;min-width:0;text-align:center}
button.seat{font-family:var(--f-display);font-weight:800;font-size:1.25rem;background:none;cursor:pointer}
.seat small{font-family:var(--f-body);font-size:.78rem;font-weight:800;line-height:1.1;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sugg{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.seat.on{border:2px solid var(--line);background:var(--surface-2);color:var(--ink)}
.seat.ready{background:var(--ok-bg);border-color:var(--green)}
.seat.voted::after{content:"";position:absolute;top:6px;right:6px;width:10px;height:10px;border-radius:50%;background:var(--blue)}
.seat.help{background:var(--late-bg);border-color:var(--red);color:var(--red);animation:pulse 1.4s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--red) 25%,transparent)}}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;font-size:.85rem;font-weight:700;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:4px;vertical-align:-1px;border:2px solid var(--line)}
.helpq{display:grid;gap:6px;margin-top:8px}
.helpq div{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 10px;border-radius:12px;background:var(--late-bg)}
.helpq b{font-family:var(--f-display);font-size:1.3rem}
.bars{display:grid;gap:8px;margin-top:10px}
.barrow{display:grid;grid-template-columns:minmax(0,1fr) 36px;gap:8px;align-items:center}
.barrow .track{height:30px;border-radius:8px;background:var(--surface-2);overflow:hidden;position:relative}
.barrow .track i{display:block;height:100%;background:color-mix(in srgb,var(--blue) 45%,transparent)}
.barrow .track span{position:absolute;left:10px;top:4px;font-weight:800;font-size:.9rem;white-space:nowrap}
.barrow b{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--f-display);font-size:1.2rem}
.ctrl{margin-top:16px}
.ctrl summary{font-family:var(--f-display);font-weight:800;font-size:1.25rem;cursor:pointer}
.grp{margin-top:16px}
.phbtns{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:6px}
.btn.on{background:var(--navy);color:var(--on-accent);border-color:var(--navy)}
.moods{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:6px}
.mood{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 4px;font-size:1.8rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.2}
.mood small{font-size:.75rem;font-weight:800;color:var(--muted)}
.mood.on{border-color:var(--green);background:var(--ok-bg)}
.lesson-list{display:grid;gap:12px}
.lcard{display:grid;gap:12px;padding:16px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);min-width:0}
.lgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:10px}
.lgrid label{display:grid;gap:4px;font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);min-width:0}
.lgrid input,.lgrid select{text-transform:none;letter-spacing:0;font-size:1rem;font-weight:600}
.lnum{flex:none;width:34px;height:34px;border-radius:50%;background:var(--navy);color:var(--on-accent);display:grid;place-items:center;font-family:var(--f-display);font-weight:800}
.strip{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.strip button{border:2px solid var(--line);background:var(--surface-2);border-radius:10px;padding:4px 10px;font-weight:800;font-size:.85rem;cursor:pointer;min-height:36px}
.strip button.on{background:var(--navy);color:var(--on-accent);border-color:var(--navy)}
.strip button.past{opacity:.55}
.conn{font-size:.8rem}
body.wide main,body.wide .top-in{max-width:1760px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* v8: Dashboard-Bereiche + Üben */
.areas{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:640px){.areas{grid-template-columns:1fr}}
.area{display:flex;flex-direction:column;gap:6px;text-align:left;padding:18px;border-radius:20px;background:var(--surface);border:1px solid var(--line);border-top:7px solid var(--ac);box-shadow:var(--shadow);cursor:pointer;color:var(--ink);font:inherit}
.area .ai{font-size:2rem;line-height:1}
.area b{font-family:var(--f-display);font-size:1.35rem}
.area small{color:var(--muted);font-weight:700}
.area .mini i{background:var(--ac)}
.a-plan{--ac:var(--blue)}.a-hw{--ac:var(--orange)}.a-play{--ac:var(--green)}
.pstrip{margin-top:14px;padding:12px;border-radius:14px;background:rgba(255,255,255,.16)}
.pstrip p{margin:8px 0 0}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pills span{padding:4px 10px;border-radius:999px;font-size:.8rem;font-weight:800;background:rgba(255,255,255,.18);opacity:.75}
.pills span.past{opacity:.5;text-decoration:line-through}
.pills span.cur{background:#fff;color:#18203d;opacity:1}
.now.idle .pstrip{background:var(--surface-2);border:1px solid var(--line)}
.now.idle .pills span{background:var(--line);color:var(--ink)}
.now.idle .pills span.cur{background:var(--navy);color:#fff}
.now.idle .pstrip .btn{background:var(--navy);border-color:var(--navy);color:#fff}
.lvl{display:flex;gap:14px;align-items:center;padding:16px;border-radius:20px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);margin-bottom:18px}
.lvl .bar{height:12px;border-radius:12px;background:var(--surface-2);overflow:hidden;margin-top:8px;border:1px solid var(--line)}
.lvl .bar i{display:block;height:100%;background:var(--green)}
.psub{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 14px}
.psub button{padding:8px 14px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font:inherit;font-weight:800;color:var(--ink);cursor:pointer}
.psub button.on{border-color:var(--sc);background:var(--sc);color:#fff}
.games{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:640px){.games{grid-template-columns:1fr}}
.gcard{display:flex;flex-direction:column;gap:6px;text-align:left;padding:18px;border-radius:20px;border:2px solid var(--line);background:var(--surface);box-shadow:var(--shadow);cursor:pointer;font:inherit;color:var(--ink)}
.gcard .gi{font-size:2.4rem;line-height:1}
.gcard b{font-family:var(--f-display);font-size:1.25rem}
.gcard small{color:var(--muted);font-weight:700}
.gcard[disabled]{opacity:.55;cursor:default}
.mem{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:12px}
@media (max-width:520px){.mem{grid-template-columns:repeat(3,minmax(0,1fr))}}
.mc{min-height:92px;border-radius:16px;border:2px solid var(--line);background:var(--sc,var(--navy));color:#fff;font:inherit;font-weight:800;font-size:1rem;cursor:pointer;padding:8px;transition:transform .15s}
.mc span{font-family:var(--f-display);font-size:2rem;opacity:.6}
.mc.up{background:var(--surface);color:var(--ink);border-color:var(--sc,var(--navy));transform:scale(1.03)}
.mc.ok{background:var(--ok-bg);border-color:var(--green);opacity:1}
.mc[disabled]{cursor:default}
.slots{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:18px 0}
.slot,.tile{width:52px;height:58px;border-radius:12px;font-family:var(--f-display);font-size:1.7rem;font-weight:800;display:inline-flex;align-items:center;justify-content:center}
.slot{border:2px dashed var(--line);background:var(--surface-2);color:var(--ink)}
button.slot{border-style:solid;border-color:var(--sc);background:var(--surface);cursor:pointer}
.tile{border:2px solid var(--sc);background:var(--sc);color:#fff;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.tile[disabled]{opacity:.15;cursor:default}
.slots.ok .slot{border-color:var(--green);background:var(--ok-bg)}
.hintbox{text-align:center;font-size:1.3rem;font-weight:800;margin-top:6px}
.fb{text-align:center;font-weight:800;margin-top:10px;min-height:1.5em}
.fb.ok{color:var(--green)}.fb.no{color:var(--orange)}
.sky{position:relative;height:190px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.bals{display:flex;gap:4px;margin-bottom:-6px}
.bal{width:34px;height:42px;border-radius:50% 50% 48% 48%;position:relative;animation:bob 2.4s ease-in-out infinite}
.bal::after{content:"";position:absolute;left:50%;top:100%;width:1px;height:34px;background:var(--muted)}
.bal:nth-child(2n){animation-delay:.6s}.bal:nth-child(3n){animation-delay:1.1s}
@keyframes bob{50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){.bal{animation:none}}
.landed{font-weight:800;color:var(--muted);text-align:center}
.kbd{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:14px}
.kbd button{width:44px;height:48px;border-radius:10px;border:2px solid var(--line);background:var(--surface);font:inherit;font-weight:800;font-size:1.15rem;color:var(--ink);cursor:pointer}
.kbd button.hit{background:var(--ok-bg);border-color:var(--green)}
.kbd button.miss{opacity:.35}
.win{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:18px;padding:16px;border-radius:20px;background:var(--ok-bg)}
.win p{margin:4px 0 0}
.gprog{font-weight:800;color:var(--muted)}

/* v9: Lehrerbereich */
body.teacher .top{border-bottom:3px solid var(--navy)}
.tchip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;background:var(--navy);color:#fff;font-weight:800;font-size:.85rem}
.areas.four{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:900px){.areas.four{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.areas.four{grid-template-columns:1fr}}
.a-tafel{--ac:var(--navy)}.a-lib{--ac:var(--orange)}.a-obs{--ac:var(--red)}
.priv{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:14px;background:var(--warn-bg);font-weight:700;margin-bottom:16px}
.libbar{display:grid;gap:12px;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
@media (max-width:760px){.libbar{grid-template-columns:1fr}}
.libgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:12px}
.mat{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--sc);box-shadow:var(--shadow);min-width:0}
.mat .nm{display:flex;gap:10px;align-items:center;min-width:0}
.mat .nm b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mat .ic{font-size:1.8rem;flex:none}
.matchips{display:flex;flex-wrap:wrap;gap:6px}
.matchip{display:inline-flex;gap:6px;align-items:center;padding:5px 6px 5px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-weight:800;font-size:.85rem;max-width:100%}
.matchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.matchip button{border:0;background:var(--line);border-radius:50%;width:22px;height:22px;cursor:pointer;font-weight:800;flex:none}
.ov .box.viewer{max-width:min(1200px,96vw);width:96vw;height:90vh;display:flex;flex-direction:column;gap:10px;text-align:left;border-color:var(--navy)}
.viewer .vbody{flex:1;min-height:0;display:grid;place-items:center;background:var(--surface-2);border-radius:14px;overflow:auto}
.viewer img{max-width:100%;max-height:100%;object-fit:contain}
.viewer iframe{width:100%;height:100%;border:0;border-radius:14px;background:#fff}
.pupils{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
.pupil{display:flex;flex-direction:column;gap:4px;text-align:left;padding:12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);cursor:pointer;font:inherit;color:var(--ink);min-width:0}
.pupil b{font-family:var(--f-display);font-size:1.3rem}
.pupil small{color:var(--muted);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pupil .dot{width:10px;height:10px;border-radius:50%;background:var(--green);display:inline-block}
.cats{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.cats button{padding:7px 12px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font:inherit;font-weight:800;cursor:pointer;color:var(--ink)}
.cats button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.note{padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:grid;gap:6px}
.note .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;color:var(--muted);font-weight:700;font-size:.85rem}
.notes{display:grid;gap:10px;margin-top:12px}
textarea.obs{width:100%;min-height:90px}

/* v9: Touch-Tafel */
button,a.btn{touch-action:manipulation}
body.tboard .mem{gap:14px}
body.tboard .mc{min-height:150px;font-size:1.5rem}
body.tboard .mc span{font-size:3rem}
body.tboard .slot,body.tboard .tile{width:84px;height:92px;font-size:2.6rem;border-radius:16px}
body.tboard .kbd button{width:68px;height:72px;font-size:1.7rem}
body.tboard .hintbox{font-size:2.2rem}
body.tboard .fb{font-size:1.5rem}
body.tboard .sky{height:260px}
body.tboard .bal{width:48px;height:60px}

/* v10: Planung, Werkzeuge, Präsentation, Kopfrechenfußball */
.tp{overflow-x:auto;margin-top:12px}
.tp table{border-collapse:separate;border-spacing:6px;width:100%;min-width:760px;table-layout:fixed}
.tp th{font-weight:800;color:var(--muted);font-size:.85rem;text-align:left;padding:0 4px}
.wk tr.pause td,.tp tr.pause td{text-align:center;font-weight:800;font-size:.8rem;color:var(--muted);background:repeating-linear-gradient(45deg,var(--surface-2) 0 8px,transparent 8px 16px);border-radius:8px;padding:4px;border:0}
.kl{display:grid;gap:16px}.kl .acc{display:flex;gap:18px;flex-wrap:wrap;align-items:center;margin-top:10px}
.kl .acc b{font-family:var(--f-display);font-size:1.6rem;letter-spacing:.08em;background:var(--surface-2);border-radius:10px;padding:4px 12px}
.splash .roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;width:min(640px,100%);margin-top:8px}
.splash .roles .btn{min-height:84px;font-size:1.25rem;flex-direction:column;gap:4px}.splash .roles .btn small{font-size:.85rem;font-weight:700;opacity:.8}
.tp td.tm{font-size:.8rem;font-weight:800;color:var(--muted);width:90px;vertical-align:top}
.tpc{min-height:74px;border-radius:12px;border:2px dashed var(--line);padding:8px;display:flex;flex-direction:column;gap:4px;cursor:pointer;font-size:.85rem;font-weight:700;color:var(--muted)}
.tpc.has{border:2px solid var(--sc);border-left-width:6px;background:var(--surface);color:var(--ink)}
.tpc.planned{background:color-mix(in srgb,var(--sc) 10%,var(--surface))}
.tpc.today{box-shadow:0 0 0 3px var(--yellow)}
.tpc b{font-size:.92rem;line-height:1.15;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tpc .add{color:var(--sc);font-weight:800}
.toolcard{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;border:2px solid var(--line);background:var(--surface-2)}
.toolcard .ti{font-size:2rem}
.pool{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:12px;text-align:left}
.pool button{display:flex;flex-direction:column;gap:4px;padding:12px;border-radius:14px;border:2px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;font:inherit;color:var(--ink)}
.pool button.fit{border-color:var(--green)}
.pool button.cur{background:var(--ok-bg)}
.pool .gi{font-size:1.8rem}.pool small{color:var(--muted);font-weight:700}
.fit-tag{font-size:.72rem;font-weight:800;color:var(--green);text-transform:uppercase;letter-spacing:.06em}
body.pres .top{display:none}
body.pres main{max-width:none!important;padding:12px 16px!important}
.pres{display:grid;grid-template-rows:auto 1fr auto;gap:12px;min-height:calc(100vh - 24px)}
.pres-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pres-top .strip{margin:0;flex:1}
.ptimer{font-family:var(--f-display);font-size:1.8rem;font-weight:800;font-variant-numeric:tabular-nums;padding:2px 14px;border-radius:12px;background:var(--surface);border:2px solid var(--line)}
.pres-main{background:var(--surface);border-radius:24px;border:1px solid var(--line);box-shadow:var(--shadow);padding:clamp(16px,3vw,40px);display:flex;flex-direction:column;min-height:0;overflow:auto;border-top:10px solid var(--sc)}
.pres-nav{display:flex;gap:12px;align-items:center}
.pres-nav .btn.big{min-width:120px;min-height:72px;font-size:2rem}
.pres-nav .pn{flex:1;min-width:0}
.pres-nav .pn b{font-family:var(--f-display);font-size:1.4rem;display:block}
.pres-nav .pn small{color:var(--muted);font-weight:700;font-size:1rem}
/* Tafel-Fenster (Beamer) und Mini-Tafel: Größen relativ zum Rahmen (cqw/cqh) */
body.boardwin{padding:0;overflow:hidden}
body.boardwin .top,body.boardwin #nav,body.boardwin #live{display:none!important}
body.boardwin main#view{max-width:none;margin:0;padding:0}
body.boardwin.tboard{overflow:auto}body.boardwin.tboard main#view{padding:24px 32px;min-height:100vh}
.bw{container-type:size;height:100%;display:grid;grid-template-rows:auto 1fr auto;background:var(--bg);color:var(--ink);border-top:1.2cqh solid var(--sc,var(--navy));overflow:hidden}
body.boardwin .bw{height:100vh}
.bw-top{display:flex;align-items:center;gap:2cqw;padding:1.6cqh 2.4cqw;font-weight:800;font-size:2.6cqh}
.bw-top .logo{font-size:3.6cqh}.bw-top .logo .on i{width:2.6cqh;height:2.6cqh}
.bw-top .tt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.bw-dots{display:flex;gap:.6cqw}.bw-dots i{width:1.6cqh;height:1.6cqh;border-radius:50%;background:var(--line)}.bw-dots i.past{background:var(--sc,var(--navy));opacity:.45}.bw-dots i.on{background:var(--sc,var(--navy))}
.bw-timer{font-family:var(--f-display);font-variant-numeric:tabular-nums;font-size:4.4cqh;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:.4cqh 2cqw}
.bw-main{display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:0;padding:1cqh 4cqw;text-align:center;gap:2.4cqh}
.bw-main .slide{gap:2.6cqh;width:100%}
/* Neue Werkzeuge nach Fabians Mathe-Vorlage: Größen in em, Basis je nach Ort */
.pres-main .rt{font-size:clamp(13px,1.8vw,28px);flex:1;min-height:60vh}
.bw-rt{display:block;position:relative;border-top:0}.bw-rt .rt{font-size:3.1cqh;height:100%}
.rt{position:relative;width:100%;border-radius:1em;overflow:hidden;display:flex;flex-direction:column;text-align:left;color:#172B31}
.rt h1{font-size:3em;line-height:1.08}
.rt .band{background:#4D8936;color:#fff;font-weight:800;font-size:1.5em;padding:.5em 1em;border-bottom:.35em solid #42A7D3}
.rt-start{background:#1d2427;color:#fff;align-items:center;justify-content:center;text-align:center}
.rt-start .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.rt-start .in{position:relative;display:grid;gap:.6em;justify-items:center;text-shadow:0 .1em .6em rgba(0,0,0,.6)}
.rt-start h1{color:#fff;font-size:3.6em}.rt-start p{font-size:1.6em;font-weight:700;color:#fff}
.rt-start .hint{background:#4D8936;border-radius:999px;padding:.5em 1.2em;font-weight:800;font-size:1.3em;text-shadow:none;margin-top:.6em}
.rt-cover{background:#f4f2ec;justify-content:center;padding:2em 3em}
.rt-cover.art{background:#f4f2ec url(assets/mathe/cover.webp) right center/auto 100% no-repeat}
.rt-cover .in{display:grid;gap:.5em;max-width:52%}
.rt-cover .kick{letter-spacing:.35em;text-transform:uppercase;font-weight:700;font-size:1.1em;color:#33433f}
.rt-cover h1{font-size:4em;color:#1d2a2e}.rt-cover .cls{border-left:.2em solid #4D8936;padding-left:.6em;font-size:1.1em;font-weight:700;color:#33433f}
.rt-q,.rt-task{background:#fff}.rt-q h1{flex:1;display:grid;place-items:center;text-align:center;padding:.4em 1em;font-size:3.4em}
.rt-q .murmel{display:flex;align-items:center;gap:1em;justify-content:center;padding:0 1em 1em}.rt-q .murmel img{height:7em;border-radius:.4em}
.rt-q .murmel p,.rt-h .tag{background:#d4edc9;padding:.4em .8em;border-radius:.3em;font-weight:700;font-size:1.3em}
.rt-h{background:#fff;align-items:center;justify-content:center;gap:1em}.rt-h img{height:9em}
.rt-task ul{list-style:none;display:grid;gap:1em;padding:1.6em 2.4em;margin:0;align-content:center;flex:1}
.rt-task li{display:flex;gap:.8em;align-items:flex-start;font-size:1.6em;font-weight:700}.rt-task li i{font-style:normal}
.rt-h5{flex-direction:row;background:#eceae7}.rt-h5 img{width:45%;object-fit:cover}.rt-h5>div{padding:1.4em 1.8em;display:grid;align-content:center;gap:.8em}
.rt-h5 h1{font-size:2.6em;font-weight:500}.rt-h5 ol{margin:0;padding-left:1.2em;display:grid;gap:.7em;font-size:1.3em;font-weight:600}
.rt-c4{background:#fff;padding:1.2em 1.6em;gap:.8em}.rt-c4 h1{font-size:2.4em;text-align:center}.rt-c4>p{text-align:center;font-weight:700;color:var(--muted);font-size:1.1em}
.rt-c4 .cg{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:.8em}.rt-c4 .cg div{border-radius:.8em;padding:.8em 1em;display:grid;align-content:center;gap:.3em;font-size:1.3em;border:.15em solid var(--line)}
.rt-c4 .cg b{font-family:var(--f-display);font-size:1.3em}
.rt-c4 .c1{background:#fde4e1}.rt-c4 .c2{background:#fff1d0}.rt-c4 .c3{background:#dcecff}.rt-c4 .c4{background:#dff3e4}
.rt-timer{position:absolute;top:2cqh;right:2cqw}
.bw-main .slide h1{font-size:10cqh}
.bw-main .slide p{font-size:4.4cqh;max-width:34ch}
.bw-main .slide .gi{font-size:16cqh}
.bw-main .slide-media{min-height:0;max-height:62cqh;width:100%}
.bw-main .slide-media img,.bw-main .slide-media video{max-height:60cqh}
.bw-main .slide-media iframe{height:60cqh}
.bw-main .kq{font-size:12cqh}
.bw-main .pitch{height:24cqh}.bw-main .pitch .ball{font-size:12cqh}.bw-main .pitch .g{font-size:6cqh}
.bw-main .bw-big{font-size:12cqh;font-family:var(--f-display)}
.bw-foot{padding:1.4cqh 2.4cqw;display:flex;justify-content:center;gap:2cqw;flex-wrap:wrap}
.bw-note{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:1cqh 2.4cqw;font-weight:800;font-size:3cqh}
.bw-hint{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--navy);color:#fff;font-weight:800;padding:10px 18px;border-radius:999px;z-index:5;transition:opacity .6s}
.lov.full:not([hidden])~.mt{display:none}
body.has-mt main#view{padding-bottom:calc(min(320px,46vw)*9/16 + 80px)}
.mt{position:fixed;right:12px;bottom:12px;z-index:31;width:min(320px,46vw);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line);background:var(--surface)}
.mt.big{left:12px;width:auto;display:grid;z-index:32}
.mt.off{width:auto;border:0;background:none;box-shadow:none;overflow:visible}
.mt-bar{display:flex;align-items:center;gap:6px;padding:4px 6px 4px 10px;font-weight:800;font-size:.85rem}
.mt-bar b{flex:1}.mt-bar button{border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:999px;font:inherit;font-size:.8rem;font-weight:800;padding:4px 10px;cursor:pointer;min-height:32px}
.mt-frame{aspect-ratio:16/9;cursor:pointer}.mt.big{right:12px;bottom:auto;top:50%;transform:translateY(-50%);grid-template-rows:auto auto}.mt.big .mt-frame{width:min(100%,calc((100vh - 90px)*16/9));justify-self:center;cursor:default}
.mt-pill{border:0;background:var(--navy);color:#fff;font:inherit;font-weight:800;padding:10px 16px;border-radius:999px;box-shadow:var(--shadow);cursor:pointer;min-height:44px}
.slide{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:18px}
.slide h1{font-size:clamp(2.6rem,6vw,5.5rem);line-height:1.05}
.slide p{font-size:clamp(1.3rem,2.6vw,2.2rem);font-weight:700;color:var(--muted);max-width:30ch}
.slide-media{width:100%;flex:1;min-height:40vh;display:grid;place-items:center}
.slide-media img,.slide-media video{max-width:100%;max-height:60vh;border-radius:16px}
.slide-media iframe{width:100%;height:60vh;border:0;border-radius:16px;background:#fff}
/* Kopfrechenfußball: Rasengrün, Dunkelgrün/Schwarz, Weiß, Blau aus der Vorlage */
.kf{--kg:#4D8936;--kd:#172B31;--kb:#42A7D3;--t0:#2e7d32;--t1:#1f7fb3;container-type:inline-size;display:grid;gap:1.4cqw;width:100%}
.kf-score{display:grid;grid-template-columns:1fr auto 1fr;background:var(--kg);border-bottom:.6cqw solid var(--kb);border-radius:1.4cqw;color:#fff;overflow:hidden;box-shadow:0 .6cqw 1.6cqw rgba(0,0,0,.18)}
.kf-st{display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto;align-items:center;gap:.2cqw 1.4cqw;padding:1cqw 2cqw;transition:background .3s}
.kf-st .nm{font-family:var(--f-display);font-size:2.6cqw;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kf-st .pt{grid-row:span 2;font-family:var(--f-display);font-weight:800;font-size:6cqw;line-height:1;font-variant-numeric:tabular-nums}
.kf-st.t1{grid-template-columns:auto 1fr;text-align:right}.kf-st.t1 .pt{grid-column:1;grid-row:1/span 2}.kf-st.t1 .nm,.kf-st.t1 .kf-tally{grid-column:2;justify-self:end}
.kf-st.on{background:color-mix(in srgb,var(--kd) 55%,transparent)}
.kf-turn{background:var(--kd);display:grid;place-items:center;align-content:center;padding:.6cqw 2.4cqw;text-align:center;min-width:18cqw}
.kf-turn span{font-size:1.4cqw;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--kb)}.kf-turn b{font-family:var(--f-display);font-size:2.4cqw;white-space:nowrap;animation:kfpulse 1.4s infinite}
.kf-tally{display:flex;gap:.6cqw;align-items:center;min-height:2.4cqw;flex-wrap:wrap}
.kf-tally i{display:inline-block;width:.45cqw;height:2.4cqw;background:#fff;border-radius:.2cqw}
.kf-tally .t5{position:relative;display:inline-flex;gap:.45cqw}.kf-tally .t5::after{content:"";position:absolute;left:-.4cqw;right:-.4cqw;top:50%;height:.45cqw;background:#fff;transform:rotate(-24deg);border-radius:.2cqw}
.kf-field{position:relative;width:min(100%,calc((100vh - 290px)*16/9));min-width:min(100%,520px);aspect-ratio:16/9;margin-inline:auto;background:#2f8a2f url(assets/kfb/field.webp) center/100% 100% no-repeat;border-radius:1.2cqw;overflow:hidden;box-shadow:0 .8cqw 2.4cqw rgba(0,0,0,.25);container-type:inline-size}
.kf-field.intro{animation:kfin 1.8s cubic-bezier(.2,.8,.2,1) both}
.kf-dot{position:absolute;width:7.2%;aspect-ratio:1;border-radius:50%;background:#fff;transform:translate(-50%,-50%);box-shadow:0 .3cqw .8cqw rgba(0,0,0,.25)}
.kf-card{position:absolute;left:50%;top:46.8%;transform:translate(-50%,-50%);background:#E0EDDF;border-radius:2.2cqw;padding:1.3cqw 1.8cqw;box-shadow:0 .6cqw 1.6cqw rgba(0,0,0,.25);max-width:80%}
.kf-q{background:#fff;border:.35cqw solid var(--kg);border-radius:1.4cqw;padding:.9cqw 3cqw;font-family:var(--f-display);font-weight:800;font-size:5cqw;color:var(--kd);white-space:nowrap;font-variant-numeric:tabular-nums;text-align:center}
.kf-ball{position:absolute;width:6.6%;aspect-ratio:1;transform:translate(-50%,-50%);transition:left 1s cubic-bezier(.3,.7,.25,1),top 1s cubic-bezier(.3,.7,.25,1);z-index:2;filter:drop-shadow(0 .5cqw .5cqw rgba(0,0,0,.4))}
.kf-ball img{width:100%;height:100%;display:block}.kf-ball.roll img{animation:kfspin 1s cubic-bezier(.3,.7,.25,1)}
.kf-side{position:absolute;top:3%;padding:.7cqw 1.6cqw;border-radius:99px;font-family:var(--f-display);font-weight:800;font-size:2.4cqw;background:rgba(10,25,15,.6);color:#fff;max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:.3cqw solid transparent;z-index:3}
.kf-side.l{left:2%}.kf-side.r{right:2%}.kf-side small{font-size:.7em;opacity:.9}
.kf-side.on.t0{background:var(--t0);border-color:#fff;animation:kfpulse 1.4s infinite}.kf-side.on.t1{background:var(--t1);border-color:#fff;animation:kfpulse 1.4s infinite}
.kf-intro{position:absolute;inset:0;display:grid;place-items:center;z-index:4;pointer-events:none}
.kf-intro b{font-family:var(--f-display);font-size:11cqw;color:#fff;text-transform:uppercase;letter-spacing:.04em;-webkit-text-stroke:.3cqw var(--kd);text-shadow:0 1cqw 2cqw rgba(0,0,0,.5);animation:kfpop 3.6s ease both}
.kf-goal{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;z-index:5;background:radial-gradient(circle,rgba(0,0,0,.15),rgba(0,0,0,.6));animation:kffade .4s both;overflow:hidden}
.kf-goal b{font-family:var(--f-display);font-size:16cqw;line-height:1;color:#fff;-webkit-text-stroke:.4cqw var(--kd);text-shadow:0 1.2cqw 3cqw rgba(0,0,0,.6);animation:kfgoal 1s cubic-bezier(.2,1.6,.4,1) both}
.kf-goal span{font-family:var(--f-display);font-size:4.4cqw;color:#fff;padding:.6cqw 3cqw;border-radius:99px;margin-top:1cqw;animation:kfpop 1.2s .3s both}
.kf-goal.t0 span{background:var(--t0)}.kf-goal.t1 span{background:var(--t1)}
.kf-goal i,.kf-conf i{position:absolute;top:-5%;width:1.2cqw;height:2cqw;border-radius:.3cqw;animation:kfconf 2.6s linear infinite}
.kf-goal i:nth-child(odd),.kf-conf i:nth-child(odd){background:#fff}.kf-goal i:nth-child(3n),.kf-conf i:nth-child(3n){background:var(--kb)}.kf-goal i:nth-child(3n+1),.kf-conf i:nth-child(3n+1){background:#8fd14f}
.kf-ctrl{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
.kf-b{font:inherit;font-weight:800;font-size:clamp(1.05rem,1.8vw,1.5rem);min-height:64px;padding:10px 26px;border-radius:16px;border:3px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;touch-action:manipulation}
.kf-b:disabled{opacity:.4;cursor:default}.kf-b.sm{font-size:1rem;min-height:52px;padding:8px 16px}
.kf-b.ok{background:#4D8936;border-color:#4D8936;color:#fff;min-width:200px}.kf-b.no{background:#172B31;border-color:#172B31;color:#fff;min-width:200px}
.kf-b.end{border-color:#172B31}
.kf-b.peek .sol{display:inline-block;min-width:2.5em;filter:blur(9px);opacity:.25;transition:filter .1s}.kf-b.peek.show .sol{filter:none;opacity:1}
.kf-snd{display:inline-flex;align-items:center;gap:6px}.kf-snd input{width:110px}
.kf-setup{background:#fff;color:#172B31;border-radius:24px;padding:clamp(14px,2.4vw,32px);text-align:center;justify-items:center;box-shadow:var(--shadow);border-top:10px solid #4D8936;border-bottom:6px solid #42A7D3}
.kf-logo{width:min(560px,80%);height:auto}
.kf-teams{display:flex;gap:16px;align-items:end;justify-content:center;flex-wrap:wrap;width:100%}
.kf-teams label{display:grid;gap:6px;text-align:left;font-weight:800;flex:1;min-width:200px;max-width:340px}
.kf-teams label span{font-size:.85rem;text-transform:uppercase;letter-spacing:.06em;color:#4D8936}
.kf-teams input{font-size:1.5rem;font-weight:800;padding:12px 16px;border:3px solid #4D8936;border-radius:14px}
.kf-teams label:last-child input{border-color:#42A7D3}.kf-teams label:last-child span{color:#1f7fb3}
.kf-teams .vs{font-family:var(--f-display);font-size:2rem;padding-bottom:10px}
.kf-opts{display:grid;gap:10px;width:min(700px,100%);text-align:left}
.kf-opts textarea{font:inherit;font-size:1.15rem;font-weight:700;padding:12px;border-radius:12px;border:2px solid var(--line);width:100%}
.kf-seg{display:flex;border:3px solid #172B31;border-radius:14px;overflow:hidden}.kf-seg button{flex:1;font:inherit;font-weight:800;font-size:1.05rem;padding:12px;border:0;background:#fff;color:#172B31;cursor:pointer}.kf-seg button.on{background:#172B31;color:#fff}
.kf-go{font-family:var(--f-display);font-size:clamp(1.8rem,3.4vw,2.8rem);padding:16px 54px;border-radius:999px;border:0;background:#4D8936;color:#fff;cursor:pointer;box-shadow:0 8px 0 #172B31;text-transform:uppercase;letter-spacing:.04em;transition:transform .1s}
.kf-go:active{transform:translateY(6px);box-shadow:0 2px 0 #172B31}
.kf-wait{justify-items:center;text-align:center;background:#fff;border-radius:2cqw;padding:3cqw}.kf-wait img{width:60%}.kf-wait p{font-family:var(--f-display);font-size:4cqw;color:#172B31}
.kf-end{position:relative;overflow:hidden;background:linear-gradient(160deg,#173d22,#0b1a10);color:#fff;border-radius:2cqw;padding:2.4cqw;display:grid;justify-items:center;gap:1.4cqw;text-align:center;border-bottom:.8cqw solid #42A7D3}

/* ---------- Time & timetable ---------- */
let SIM=null; // {day:0..4, min, setAt}
const toMin=t=>{const [h,m]=t.split(':').map(Number);return h*60+m};
function nowInfo(){
  if(SIM){const el=Math.floor((Date.now()-SIM.setAt)/60000);return {day:SIM.day,min:SIM.min+el,sim:true}}
  const d=new Date();return {day:d.getDay()-1,min:d.getHours()*60+d.getMinutes(),sim:false};
}
function slotNow(){
  const n=nowInfo();
  if(n.day<0||n.day>4)return {kind:'weekend',n};
  const lessons=PERIODS.map((p,i)=>({p:p[0],start:toMin(p[1]),end:toMin(p[2]),from:p[1],to:p[2],s:WEEK[n.day][i]})).filter(l=>l.s);
  if(!lessons.length)return {kind:'free',n};
  for(const l of lessons){if(n.min>=l.start&&n.min<l.end)return {kind:'lesson',l,n,next:lessons.find(x=>x.start>=l.end)}}
  const next=lessons.find(l=>l.start>n.min);
  if(n.min<lessons[0].start)return {kind:'before',next,n};
  if(next)return {kind:'break',next,n};
  return {kind:'after',n};
}
const hhmm=m=>`${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
function todayISO(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function daysUntil(iso){return Math.round((new Date(iso+'T00:00')-new Date(todayISO()+'T00:00'))/864e5)}
function dueLabel(iso){const d=daysUntil(iso);if(d<0)return ['late','überfällig'];if(d===0)return ['soon','heute'];if(d===1)return ['soon','morgen'];
  const w=['So','Mo','Di','Mi','Do','Fr','Sa'][new Date(iso+'T00:00').getDay()];return ['',`bis ${w}, ${iso.slice(8,10)}.${iso.slice(5,7)}.`]}
const fmtDate=iso=>`${iso.slice(8,10)}.${iso.slice(5,7)}.${iso.slice(0,4)}`;

let AC;
function ctx(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}return AC}
function tone(f,start,dur,type='sine',vol=.22){
  const a=ctx();if(!a)return;
  const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+start;
  o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.05);
}

  const g=V.g;if(!g||g.lock||g.open.includes(i)||g.done[g.cards[i].k])return;
  g.open.push(i);

let CS=null,ROSTER={},TALLY={};

  CS=Object.assign({phase:'arrive',phaseAt:Date.now(),timer:{run:false,total:300,left:300,endsAt:0},poll:null,ready:null,freeze:false,help:[],rocket:S.rocket||0,mission:S.mission},S.cs||{});

function online(){const t=Date.now();return Object.keys(ROSTER).map(Number).filter(n=>t-ROSTER[n].seen<12000)}
function onStudentMsg(m){
  const nr=+m.nr;if(!(nr>=1&&nr<=40)||!CS)return;
  (ROSTER[nr]=ROSTER[nr]||{}).seen=Date.now();
  if(m.nick){const nk=cleanNick(m.nick);if(nk&&nk!==ROSTER[nr].nick){ROSTER[nr].nick=nk;if(TD.nicks[nr]!==nk){TD.nicks[nr]=nk;tsave()}if(V.name==='tafel')updTafel()}}
  let ch=false;
  if(m.k==='kfb'){kfbAnswer(nr,m);return}
  if(m.k==='help'){const has=CS.help.includes(nr);if(m.on&&!has){CS.help.push(nr);ch=true;SND.right()}if(!m.on&&has){CS.help=CS.help.filter(x=>x!==nr);ch=true}}
  if(m.k==='ready'&&CS.ready&&m.id===CS.ready.id&&!CS.ready.done.includes(nr)){CS.ready.done.push(nr);ch=true}
  if(m.k==='vote'&&CS.poll&&m.id===CS.poll.id&&!CS.poll.voted.includes(nr)){CS.poll.voted.push(nr);TALLY[m.o]=(TALLY[m.o]||0)+1;ch=true}
  if(m.k==='journal'&&CS.journal&&m.id===CS.journal.id&&!CS.journal.done.includes(nr)){CS.journal.done.push(nr);ch=true}
  if(m.k==='hi'&&!ROSTER[nr].known){ROSTER[nr].known=1;ch=true}
  if(CS.ready&&!CS.ready.rewarded){const on=online();if(on.length&&on.every(n=>CS.ready.done.includes(n))){CS.ready.rewarded=true;CS.rocket=Math.min(10,CS.rocket+1);SND.cheer();ch=true}}
  if(ch)pushCS();
  if(V.name==='tafel')updTafel();
}

    try{await idb('blob','readwrite',st=>st.put(f,id));await idb('meta','readwrite',st=>st.put({id,kind:'file',name:f.name,mime:f.type||'',size:f.size,subject:subj,added:Date.now()}));n++}catch(e){LIB.msg='Speichern fehlgeschlagen: Ist der Speicher voll?'}}

  await libLoad();
}

async function libView(id){

  showOv(`<div class="box viewer" role="dialog" aria-label="${esc(m.name)}"><div class="row" style="justify-content:space-between"><b style="font-family:var(--f-display);font-size:1.3rem">${matIcon(m)} ${esc(m.name)}</b>

function newLessonFrom(subj,min,title){
  const base=clone(TEMPLATES[subj]||SCAFFOLD),tot=base.reduce((a,p)=>a+p.min,0),f=min/tot;
  base.forEach(p=>{p.min=Math.max(1,Math.round(p.min*f));if(p.target==='heft:M'&&subj!=='M')p.target='heft:'+subj;if(p.tool&&p.tool.s&&GAMES[subj])p.tool.s=subj});
  const L={id:lid(),cid:S.cls,title,subject:subj,mission:'',phases:base,tpl:TEMPLATES[subj]?'Vorlage':''};
  lessons().push(L);save();return L;
}

/* --- Kopfrechenfußball --- */
/* =====================================================================
   KOPFRECHNEN-FUSSBALL (nach Fabians PowerPoint-Vorlage)
   Zwei Teams abwechselnd, Lehrkraft bewertet Richtig/Falsch,
   3 Felder Richtung Tor = Tor. Lösung sieht nur die Lehrkraft.
   ===================================================================== */
const KFA='assets/kfb/';
const KFB_LEVELS={pvs:'Punkt vor Strich (wie Vorlage)',pm:'Plus und Minus bis 100',x:'Einmaleins (· und :)',mix:'Gemischt, schwerer',
  '1x1':'Kleines Einmaleins','plus':'Plus bis 100','minus':'Minus bis 100','quad':'Quadratzahlen bis 20','proz':'Einfache Prozente'};
const KFB_EXAMPLES=['45 + 18 − 20','70 − 25 − 15','56 : 7 + 9','8 · 7 − 16','45 − 6 · 5','72 : 8 · 4','63 − 18 − 12','36 : 6 + 7 · 4','80 − 24 : 6','9 · 6 − 24 : 4'];
// Ballstationen aus Folie 5 (Anteil von Breite/Höhe des Spielfelds), von der Mitte Richtung Tor
const KF_SPOTS={0:[.5,.665],1:[.597,.193],2:[.666,.765],3:[.837,.577],'-1':[.386,.191],'-2':[.334,.768],'-3':[.151,.565],net1:[.968,.5],'net-1':[.032,.5]};
function kfNorm(s){return String(s).replace(/[*×]/g,'·').replace(/(\d)\s*[xX]\s*(?=\d)/g,'$1·').replace(/[÷/]/g,':').replace(/[–—-]/g,'−').replace(/=\s*\??\s*$/,'').replace(/\s+/g,'').trim()}
const kfPretty=s=>kfNorm(s).replace(/([+−·:])/g,' $1 ');
function kfEval(s){
  const t=kfNorm(s),tok=t.match(/\d+(?:[.,]\d+)?|[+−·:()]/g);if(!tok||tok.join('')!==t)return null;let i=0;
  const num=()=>{const x=tok[i++];if(x==='('){const v=expr();if(tok[i++]!==')')throw 0;return v}if(x==null||!/\d/.test(x))throw 0;return parseFloat(x.replace(',','.'))};
  const term=()=>{let v=num();while(tok[i]==='·'||tok[i]===':'){const o=tok[i++],w=num();if(o===':'&&w===0)throw 0;v=o==='·'?v*w:v/w}return v};
  const expr=()=>{let v=term();while(tok[i]==='+'||tok[i]==='−'){const o=tok[i++],w=term();v=o==='+'?v+w:v-w}return v};
  try{const v=expr();return i===tok.length?Math.round(v*1000)/1000:null}catch(e){return null}
}
function kfParseList(txt){const ok=[],bad=[];String(txt||'').split(/\n|;/).map(x=>x.trim()).filter(Boolean).forEach(l=>{const a=kfEval(l);a==null?bad.push(l):ok.push({q:kfPretty(l),a})});return {ok,bad}}
function kfbTask(lv){const r=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
  if(lv==='plus'){const a=r(11,89),b=r(5,100-a);return {q:`${a} + ${b}`,a:a+b}}
  if(lv==='minus'){const a=r(20,100),b=r(5,a-1);return {q:`${a} − ${b}`,a:a-b}}
  if(lv==='quad'){const a=r(2,20);return {q:`${a}²`,a:a*a}}
  if(lv==='proz'){const pc=[10,20,25,50][r(0,3)],base=pc===25?r(1,20)*4:pc===20?r(1,20)*5:r(1,20)*10;return {q:`${pc} % von ${base}`,a:base*pc/100}}
  if(lv==='1x1'){const a=r(2,10),b=r(2,10);return {q:`${a} · ${b}`,a:a*b}}
  for(let k=0;k<300;k++){let q;const a=r(2,10),b=r(2,10),c=r(2,9);
    if(lv==='pm')q=[`${r(10,60)} + ${r(5,40)} − ${r(2,30)}`,`${r(40,99)} − ${r(5,30)} − ${r(2,20)}`,`${r(20,70)} − ${r(2,19)} + ${r(5,25)}`][r(0,2)];
    else if(lv==='x')q=[`${a} · ${b}`,`${a*b} : ${a}`,`${a*b} : ${b} · ${c}`][r(0,2)];
    else if(lv==='mix')q=[`${a} · ${b} − ${c*r(2,9)} : ${c}`,`${a*c} : ${c} + ${b} · ${r(2,9)}`,`${r(50,100)} − ${a} · ${b} + ${r(2,20)}`,`${a} · ${b} : ${a} + ${r(10,60)}`][r(0,3)];
    else q=[`${a} · ${b} − ${r(2,30)}`,`${a*b} : ${a} + ${r(2,30)}`,`${r(40,100)} − ${a} · ${b}`,`${a*b} : ${b} · ${c}`,`${r(20,90)} − ${a*b} : ${a}`,`${a*b} : ${a} + ${c} · ${r(2,9)}`,`${r(20,60)} + ${r(5,30)} − ${r(2,25)}`][r(0,6)];
    const v=kfEval(q);if(v!=null&&v>=0&&v<=100&&Number.isInteger(v))return {q:kfPretty(q),a:v}}
  return {q:'8 · 7',a:56}}
let KF=null;
const teamOf=k=>(TD.teams&&TD.teams[k])||(k<=Math.ceil(S.classSize/2)?'A':'B');
const kfTeamIdx=k=>teamOf(k)==='A'?0:1;
function kfCfg(){TD.kfb=TD.kfb||{names:['Team 1','Team 2'],mode:'rand',level:'pvs',list:''};return TD.kfb}
const KF_LEGACY={'1x1':'x','plus':'pm','minus':'pm','quad':'x','proz':'pvs'};
function kfbStart(level,quiet){const c=kfCfg();level=KF_LEGACY[level]||level;if(level&&KFB_LEVELS[level])c.level=level;
  KF={phase:'setup',names:c.names.slice(),mode:c.mode,level:c.level,list:[],idx:0,task:null,pos:0,net:false,score:[0,0],turn:0,goal:null,last:null,ask:null,teamEdit:false,busy:false};
  if(!quiet)kfbPush()}
function kfbStop(quiet){KF=null;if(CS){CS.kfb=null;if(!quiet)pushCS()}}
function kfbSync(){if(!CS)return;CS.kfb=KF?{phase:KF.phase,names:KF.names,q:KF.task?KF.task.q:'',pos:KF.pos,net:KF.net,score:KF.score.slice(),turn:KF.turn,goal:KF.goal,last:KF.last?{ok:KF.last.ok,team:KF.last.team}:null,

const KS={ctx:null,master:null,vol:0.8,muted:false,goalEl:null,
  load(){try{const v=localStorage.getItem('elio-kfb-vol');if(v!=null)this.vol=+v;this.muted=localStorage.getItem('elio-kfb-mute')==='1'}catch(e){}},
  save(){try{localStorage.setItem('elio-kfb-vol',this.vol);localStorage.setItem('elio-kfb-mute',this.muted?'1':'0')}catch(e){}},
  apply(){if(this.master)this.master.gain.value=this.muted?0:this.vol;if(this.goalEl)this.goalEl.volume=this.muted?0:this.vol},
  ac(){if(BOARD)return null;if(!this.ctx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;this.ctx=new C();this.master=this.ctx.createGain();this.master.connect(this.ctx.destination);this.apply()}
    if(this.ctx.state==='suspended')this.ctx.resume();return this.ctx},
  noise(c,sec){const b=c.createBuffer(1,Math.max(1,Math.floor(c.sampleRate*sec)),c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;const s=c.createBufferSource();s.buffer=b;return s},
  env(c,g,t,a,hold,rel,peak){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);g.gain.setValueAtTime(peak,t+a+hold);g.gain.exponentialRampToValueAtTime(0.0001,t+a+hold+rel)},
  // Stadion: mehrere Rausch-Bänder mit unruhiger Lautstärke = Menge
  crowd(sec,peak=.35,delay=0){const c=this.ac();if(!c)return;const t=c.currentTime+delay;
    [[350,.8],[900,.7],[1800,.9],[3200,1.4]].forEach(([f,q],j)=>{const s=this.noise(c,sec),bp=c.createBiquadFilter(),g=c.createGain(),lfo=c.createOscillator(),lg=c.createGain();
      bp.type='bandpass';bp.frequency.value=f;bp.Q.value=q;const p=peak*[1,.9,.6,.3][j];this.env(c,g,t,sec*.3,sec*.35,sec*.35,p);
      lfo.frequency.value=2+Math.random()*5;lg.gain.value=p*.35;lfo.connect(lg);lg.connect(g.gain);s.connect(bp);bp.connect(g);g.connect(this.master);s.start(t);lfo.start(t);s.stop(t+sec);lfo.stop(t+sec)})},
  whistle(dur=.4,delay=0,vol=.22){const c=this.ac();if(!c)return;const t=c.currentTime+delay,g=c.createGain(),bp=c.createBiquadFilter();bp.type='bandpass';bp.frequency.value=3000;bp.Q.value=4;
    const trem=c.createOscillator(),tg=c.createGain();trem.frequency.value=28;tg.gain.value=vol*.5;trem.connect(tg);tg.connect(g.gain);
    [2950,3080].forEach(f=>{const o=c.createOscillator();o.type='square';o.frequency.value=f;o.connect(bp);o.start(t);o.stop(t+dur+.05)});
    bp.connect(g);g.connect(this.master);this.env(c,g,t,.02,dur-.06,.04,vol);trem.start(t);trem.stop(t+dur+.05)},
  kick(){const c=this.ac();if(!c)return;const t=c.currentTime,o=c.createOscillator(),g=c.createGain();o.frequency.setValueAtTime(160,t);o.frequency.exponentialRampToValueAtTime(45,t+.16);
    g.gain.setValueAtTime(.9,t);g.gain.exponentialRampToValueAtTime(.001,t+.22);o.connect(g);g.connect(this.master);o.start(t);o.stop(t+.25);
    const n=this.noise(c,.03),hp=c.createBiquadFilter(),ng=c.createGain();hp.type='highpass';hp.frequency.value=1500;ng.gain.value=.4;n.connect(hp);hp.connect(ng);ng.connect(this.master);n.start(t)},
  roll(){const c=this.ac();if(!c)return;const t=c.currentTime,n=this.noise(c,.8),lp=c.createBiquadFilter(),g=c.createGain();lp.type='lowpass';lp.frequency.value=380;this.env(c,g,t,.05,.35,.4,.35);n.connect(lp);lp.connect(g);g.connect(this.master);n.start(t)},
  ohh(){const c=this.ac();if(!c)return;const t=c.currentTime;
    [[800,320,5],[2300,1000,6]].forEach(([f0,f1,q],j)=>{const n=this.noise(c,1.6),bp=c.createBiquadFilter(),g=c.createGain();bp.type='bandpass';bp.Q.value=q;bp.frequency.setValueAtTime(f0,t);bp.frequency.exponentialRampToValueAtTime(f1,t+1.4);
      this.env(c,g,t,.25,.6,.7,j?.25:.6);n.connect(bp);bp.connect(g);g.connect(this.master);n.start(t)})},
  goal(){if(BOARD)return;try{if(!this.goalEl)this.goalEl=new Audio(KFA+'goal.mp3');this.apply();this.goalEl.currentTime=0;this.goalEl.play().catch(()=>{})}catch(e){}this.crowd(5,.4,.2)},
  intro(){this.crowd(4.4,.38);this.whistle(.25,3.0);this.whistle(1,3.35)},
  final(){this.whistle(.28,0);this.whistle(.28,.45);this.whistle(1.3,.9);this.crowd(3.5,.3,.8)},
};

// Geteilte Stunden: SPLIT["d-i"]=[Fächer]; jede/r SuS wählt einmal die eigene Gruppe (S.mySubj)
let SPLIT={},SLOTS_RAW=null;
function applyWeek(sl){
  WEEK.forEach(r=>r.fill(null));SPLIT={};const by={};
  sl.forEach(x=>{if(WEEK[x.day]&&x.period<WEEK[x.day].length)(by[x.day+'-'+x.period]=by[x.day+'-'+x.period]||[]).push(x)});
  const mine=S.mySubj||[];
  Object.entries(by).forEach(([k,xs])=>{const [d,i]=k.split('-').map(Number);xs.sort((a,b)=>(a.grp||0)-(b.grp||0));
    const subs=[...new Set(xs.map(x=>x.subject))];if(subs.length>1)SPLIT[k]=subs;
    WEEK[d][i]=subs.find(x=>mine.includes(x))||subs[0]});
  TIMETABLE_EXAMPLE=false;
}
const splitSets=()=>{const m={};Object.values(SPLIT).forEach(a=>{const k=a.slice().sort().join('|');m[k]=a.slice().sort()});return Object.values(m)};
function splitPanel(onlyOpen){
  if(S.role!=='student')return '';
  const sets=splitSets(),mine=S.mySubj||[],open=sets.filter(a=>!a.some(x=>mine.includes(x)));
  const list=onlyOpen?open:sets;if(!list.length)return '';
  return `<section class="panel" style="margin-bottom:14px"><span class="label">Geteilter Unterricht</span><p style="font-weight:700;margin:4px 0 8px">${open.length?'Manche Stunden hat deine Klasse in Gruppen. Welche Gruppe ist deine?':'Deine Gruppen. Tippe, um sie zu ändern.'}</p>
    ${list.map(a=>`<div class="row" style="margin-top:6px">${a.map(x=>`<button class="btn sm ${mine.includes(x)?'on':''} s-${x}" data-act="my-subj" data-set="${a.join('|')}" data-s="${x}">${badge(x)} ${esc(SUBJECTS[x]?SUBJECTS[x].name:x)}</button>`).join('<span class="muted" style="font-weight:800">oder</span>')}</div>`).join('')}</section>`;
}
async function cloudLoadWeek(cid){
  try{const sl=await q(Cloud.sb.from('slots').select('day,period,subject,grp').eq('class_id',cid));
    if(sl.length){SLOTS_RAW=sl;applyWeek(sl)}}catch(e){}
}
// Lehrkraft: eigener Stundenplan (alle Klassen), Wochenplanung, Stunden
async function cloudSync(){
  if(!Cloud.prof||Cloud.prof.role==='pending')return;
  const sb=Cloud.sb,uid=Cloud.user.id,ids=Cloud.myClasses.map(c=>c.id);
  try{
    const sl=ids.length?await q(sb.from('slots').select('class_id,day,period,subject,teacher_id,grp').in('class_id',ids)):[];
    TD.tt={};sl.filter(x=>x.teacher_id===uid).forEach(x=>{const c=Cloud.myClasses.find(k=>k.id===x.class_id);const split=sl.filter(y=>y.class_id===x.class_id&&y.day===x.day&&y.period===x.period).length>1;TD.tt[x.day+'-'+x.period]={s:x.subject,c:(c?c.name:'')+(split?' (Gruppe)':''),cid:x.class_id,g:x.grp||0}});TD.ttEx=false;
    const pl=ids.length?await q(sb.from('plans').select('class_id,date,period,lesson_id,teacher_id,grp').in('class_id',ids)):[];
    TD.plan={};pl.forEach(x=>{const t=TD.tt[((new Date(x.date+'T12:00').getDay()+6)%7)+'-'+x.period];if(t&&t.cid===x.class_id&&(t.g||0)===(x.grp||0))TD.plan[x.date+'|'+x.period]=x.lesson_id});tsave();
    const ls=await q(sb.from('lessons').select('id,owner,class_id,shared,data'));
    const planned=new Set(Object.values(TD.plan));
    // Die Demo-Stunde wandert nur in die Cloud, wenn sie verplant ist
    const mine=lessons().filter(L=>(!L.owner||L.owner===uid)&&!(L.id==='L-bsp'&&!ls.some(x=>x.id===L.id)&&!planned.has(L.id)));
    // Lokale Stunden beim ersten Login hochladen
    mine.forEach(L=>{if(!ls.some(x=>x.id===L.id)){if(L.id==='L-bsp'){const nid=lid();Object.keys(TD.plan).forEach(k=>{if(TD.plan[k]===L.id)TD.plan[k]=nid});L.id=nid}L.owner=uid;L.cid=L.cid||S.cls}});
    const fromCloud=ls.map(x=>Object.assign({},x.data,{id:x.id,owner:x.owner,cid:x.class_id,shared:x.shared}));
    const merged=fromCloud.concat(mine.filter(L=>!ls.some(x=>x.id===L.id)));
    S.lessons=merged;Cloud.sig={};ls.forEach(x=>{Cloud.sig[x.id]=JSON.stringify(lessonRow(fromCloud.find(L=>L.id===x.id)))});
    try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}cloudQueue();
  }catch(e){console.warn(e);Cloud.err='Sync fehlgeschlagen.'}
}
function lessonRow(L){const d=Object.assign({},L);['id','owner','cid','shared'].forEach(k=>delete d[k]);return {id:L.id,class_id:L.cid||null,subject:L.subject,title:L.title,data:d,shared:!!L.shared}}
let cloudT=null;
function cloudQueue(){
  if(!CLOUD||!Cloud.prof||Cloud.prof.role==='pending'||S.role!=='teacher')return;
  clearTimeout(cloudT);cloudT=setTimeout(async()=>{
    const uid=Cloud.user.id,rows=[];
    (S.lessons||[]).forEach(L=>{if(L.owner&&L.owner!==uid)return;L.owner=uid;const r=lessonRow(L),sg=JSON.stringify(r);if(Cloud.sig[L.id]!==sg){rows.push(r);Cloud.sig[L.id]=sg}});
    if(rows.length){try{await q(Cloud.sb.from('lessons').upsert(rows))}catch(e){console.warn(e);rows.forEach(r=>delete Cloud.sig[r.id])}}
  },1200);
}
async function cloudDelLesson(id){if(!CLOUD||!Cloud.prof)return;try{await q(Cloud.sb.from('lessons').delete().eq('id',id));delete Cloud.sig[id]}catch(e){}}
async function cloudPlan(d,i,date,lessonId){if(!CLOUD||!Cloud.prof)return;const t=TD.tt[d+'-'+i];if(!t||!t.cid)return;
  clearTimeout(cloudT);const L=lessonById(lessonId);if(L){L.cid=L.cid||t.cid;await new Promise(r=>setTimeout(r,0))}
  try{if(L){const r=lessonRow(L);await q(Cloud.sb.from('lessons').upsert([r]));Cloud.sig[L.id]=JSON.stringify(r)}
    await q(Cloud.sb.from('plans').upsert([{class_id:t.cid,date,period:i,grp:t.g||0,lesson_id:lessonId}]))}catch(e){console.warn(e)}}
async function cloudUnplan(k){if(!CLOUD||!Cloud.prof)return;const [date,i]=k.split('|'),d=(new Date(date+'T12:00').getDay()+6)%7,t=TD.tt[d+'-'+i];if(!t||!t.cid)return;
  try{await q(Cloud.sb.from('plans').delete().eq('class_id',t.cid).eq('date',date).eq('period',+i).eq('grp',t.g||0))}catch(e){}}

async function lgIn(up){
  const em=($('#lg-mail').value||'').trim(),pw=$('#lg-pw').value||'';
  if(!/\S+@\S+\.\S+/.test(em)||pw.length<8){V.err='Bitte E-Mail und ein Passwort mit mindestens 8 Zeichen eingeben.';V.msg='';render();return}
  const sb=await sbClient();
  const r=up?await sb.auth.signUp({email:em,password:pw,options:{emailRedirectTo:location.origin+location.pathname}}):await sb.auth.signInWithPassword({email:em,password:pw});
  if(r.error){V.err=up?'Konto konnte nicht erstellt werden: '+r.error.message:'Anmelden hat nicht geklappt. Stimmen E-Mail und Passwort?';V.msg='';render();return}
  if(up&&!r.data.session){V.err='';V.msg='Fast geschafft: Bestätige den Link in deiner E-Mail und melde dich dann hier an.';render();return}
  Cloud.user=r.data.user;V.err='';V.msg='';await cloudLoadMe();
  if(V.asAdmin&&Cloud.prof&&Cloud.prof.role==='admin'){S.role='teacher';saveRole();if(!CS)initTeacher();A.ok=false;go('admin');return}
  if(Cloud.myClasses.length===1&&Cloud.prof.role==='teacher'){await teacherEnter(Cloud.myClasses[0]);return}
  render();
}

function checkJournalAuto(){
  if(S.role!=='student')return;
  const sl=slotNow();if(sl.kind!=='lesson')return;
  const left=sl.l.end-sl.n.min;if(left>5||left<=0)return;
  const key=`auto|${todayISO()}|${sl.n.day}|${sl.l.p}${sl.n.sim?'|sim':''}`;
  if(S.journalDone[key])return;
  const ov=$('#ov');if(!ov.hidden&&ov.dataset.k===key)return;
  if(RCS&&RCS.journal)return; // teacher already opened it live
  SND.change();showOv(`<div class="box" style="text-align:left">${journalForm('auto',key)}</div>`,key);
}
function saveJournal(src,id){
  const learned=($('#jr-learned')||{}).value||'',hard=($('#jr-hard')||{}).value||'';
  if(learned.trim().length<3){$('#jr-err').textContent='Schreib mindestens einen kurzen Satz.';return}
  const sl=slotNow();
  S.journal=S.journal||[];S.journal.push({at:Date.now(),subj:sl.kind==='lesson'?sl.l.s:null,learned:learned.trim(),hard:hard.trim(),mood:JM});
  if(id)S.journalDone[id]=1;
  earnOnce('jr_'+(id||Date.now()));SND.cheer();save();
  if(src==='live'){sendMsg({k:'journal',id});if(RCS)S.phaseSeen=String(RCS.phaseAt);save();lastOvSig='';liveOverlay()}
  else if(src==='auto'){$('#ov').hidden=true;render()}
  else{V.form=false;render()}
}
VIEWS.journal=()=>{

  return `<div class="row" style="justify-content:space-between;margin-bottom:14px"><h1>Mein Lerntagebuch</h1>${V.form?'':'<button class="btn pri" data-act="jr-new">Neuer Eintrag</button>'}</div>
  ${V.form?`<section class="panel" style="margin-bottom:16px">${journalForm('free')}</section>`:''}
  ${list.length?`<div class="entries">${list.map(e=>`<article class="page ${e.subj?'s-'+e.subj:''}"><header><h3>${e.subj?SUBJECTS[e.subj].name:'Eintrag'}</h3>
      <span class="date">${new Date(e.at).toLocaleDateString('de-DE')} ${e.mood!=null&&MOODS[e.mood]?MOODS[e.mood][0]:''}</span></header>
