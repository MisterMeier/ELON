    case 'tt-set':CS.timer={run:false,total:+d.m*60,left:+d.m*60,endsAt:0};pushCS();render();break;
    case 'tt-go':if(CS.timer.run){CS.timer.left=timerLeft(CS.timer);CS.timer.run=false}else{if(CS.timer.left<=0)CS.timer.left=CS.timer.total;CS.timer.endsAt=Date.now()+CS.timer.left*1000;CS.timer.run=true}pushCS();render();break;
    case 'tt-reset':CS.timer={run:false,total:CS.timer.total,left:CS.timer.total,endsAt:0};pushCS();render();break;
    case 't-frz':CS.freeze=!CS.freeze;if(CS.freeze)SND.freeze();pushCS();render();break;
    case 't-rdy':CS.ready=CS.ready?null:{id:'r'+Date.now(),done:[],rewarded:false};pushCS();render();break;
    case 't-poll':{let q,opts;
      if(d.t==='custom'){q=$('#cp-q').value.trim();opts=[1,2,3,4].map(i=>$('#cp-o'+i).value.trim()).filter(Boolean);if(!q||opts.length<2){$('#cp-q').focus();$('#cp-q').placeholder='Bitte Frage und mindestens 2 Antworten eintragen';break}}
      else{q=POLLS[d.t].q;opts=POLLS[d.t].opts}
      CS.poll={id:'p'+Date.now(),type:d.t,q,opts,voted:[]};TALLY={};pushCS();render();break}
    case 't-poll-end':CS.poll=null;pushCS();render();break;
    case 't-help-done':CS.help=CS.help.filter(x=>x!==+d.n);pushCS();updTafel();break;
    case 't-rk':CS.rocket=Math.max(0,Math.min(10,CS.rocket+(+d.d)));if(+d.d>0)CS.rocket>=10?SND.cheer():SND.right();pushCS();updTafel();break;
    case 't-cls':{const n=parseInt($('#t-cls').value,10);if(n>=2&&n<=40){S.classSize=n;save();updTafel()}break}
    case 'help':if(RCS)sendMsg({k:'help',on:!RCS.help.includes(S.nr)});break;
    case 'ready':if(RCS&&RCS.ready){S.readyDone[RCS.ready.id]=1;save();sendMsg({k:'ready',id:RCS.ready.id});SND.right();liveOverlay()}break;
    case 'vote':if(RCS&&RCS.poll){S.voted[RCS.poll.id]=1;save();sendMsg({k:'vote',id:RCS.poll.id,o:+d.o});SND.right();liveOverlay()}break;
    case 'g-join':if(RCS&&RCS.game){S.gameSeen=RCS.game.at;save();lastOvSig='';$('#live-ov').hidden=true;go(RCS.game.g,{s:RCS.game.s})}break;
    case 'phase-go':{const ph=phaseOf(RCS.phase);S.phaseSeen=String(RCS.phaseAt);save();lastOvSig='';$('#live-ov').hidden=true;
      goTarget(ph.go);
      liveOverlay();break}
    case 'dash':go(S.role==='teacher'?'tdash':'dash');break;
    case 'homework':go('homework');break;
    case 'practice':go('practice',d.s?{s:d.s}:{});break;
    case 'ps':S.lastPs=d.s;save();V.s=d.s;render();break;
    case 'game':go(d.g,{s:d.s});break;
    case 'g-again':go(V.name,{s:V.s,back:V.back});break;
    case 'mem':memClick(+d.i);break;
    case 'sal-pick':{const g=V.g;if(g.fb==='no')g.fb='';g.pick.push(+d.j);if(g.pick.length===g.W[g.i].w.length)saladCheck();render();break}
    case 'sal-un':{const g=V.g;g.pick.splice(+d.p,1);g.fb='';render();break}
    case 'sal-clear':V.g.pick=[];V.g.fb='';render();break;
    case 'sal-next':{const g=V.g;if(g.i+1<g.W.length){g.i++;g.pick=[];g.letters=null;g.tries=0;g.fb=''}else finishGame(g);render();break}
    case 'bal':balGuess(d.l);break;
    case 'bal-next':{const g=V.g;if(g.i+1<g.W.length){g.i++;g.guess={};g.wrong={};g.miss=0}else finishGame(g);render();break}
    case 'week':go('week');break;
    case 'board':go('board');break;
    case 'subject':go('subject',{s:d.s});break;
    case 'tab':V.tab=d.t;render();break;
    case 'module':go('module');break;
    case 'close-ov':$('#ov').hidden=true;if(d.to==='subject')go('subject',{s:d.s});else if(d.to)go(d.to);break;
    case 'prep':b.classList.toggle('on');b.querySelector('i').textContent=b.classList.contains('on')?'✓':'';SND.right();break;
    case 'recheck':{const sl=slotNow();if(sl.kind==='lesson')lessonPopup(sl,null);break}
    case 'hw':S.hwDone[d.id]=!S.hwDone[d.id];if(S.hwDone[d.id]){SND.right();earnOnce('hw_'+d.id)}save();render();break;
    case 'copied':S.copied[d.id]=!S.copied[d.id];if(S.copied[d.id]){SND.right();earnOnce('cp_'+d.id)}save();render();break;
    case 'say':say(d.t);break;
    case 'complete':complete(d.id);break;
    case 'station':{
      W={};const init={words:initWords,phrases:initPhrases,order:initOrder,ladder:initLadder,swap:initSwap,reflect:initReflect}[d.id];
      if(init)init();go('station',{id:d.id});break}
    case 'wu-mode':stops.forEach(f=>f());stops=[];W={mode:d.m,deck:shuffle(TABOO.map((_,i)=>i)),i:0,got:0,left:null};if(d.m==='heads')startHeads();render();break;
    case 'wu-back':stops.forEach(f=>f());stops=[];W={};render();break;
    case 'wu-next':if(d.got){W.got++;SND.right()}W.i++;W.anim='pop';render();break;
    case 'w-pick':{
      const k=+d.k,cur=W.q[0];
      if(k===cur){SND.right();say(VOCAB[k][0]);if(W.miss)mutStar();W.q.shift();W.done++;W.miss=false;
        b.classList.add('right');setTimeout(()=>{if(W.q.length)W.opts=mkOpts(W.q[0]);render()},650);}
      else{SND.oops();W.miss=true;b.classList.add('shake');b.disabled=true;const m=$('#w-msg');if(m)m.textContent='Kein Problem! Fehler sind Freunde. Probier ein anderes Wort.'}
      break}
    case 'p-q':W.sel=+d.i;render();break;
    case 'p-a':{
      if(W.sel==null){b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),400);break}
      if(+d.i===W.sel){SND.right();say(PAIRS[W.sel][0]+' '+PAIRS[W.sel][1]);if(W.miss)mutStar();W.ok.push(W.sel);W.sel=null;W.miss=false;render()}
      else{SND.oops();W.miss=true;render()}
      break}
    case 'o-pick':{
      const i=+d.i;
      if(i===W.placed.length){SND.right();if(W.miss)mutStar();W.placed.push(i);W.pool=W.pool.filter(x=>x!==i);W.miss=false;W.shake=null}
      else{SND.oops();W.miss=true;W.shake=i}
      render();break}
    case 'l-step':W.step=+d.s;render();break;
    case 'l-role':W.role=d.r;render();break;
    case 'l-swap':W.role=W.role==='A'?'B':'A';SND.swap();render();break;
    case 'l-rev':W.rev[d.k]=true;render();break;
    case 'l-cards':W.cards=rollCards();render();break;
    case 's-help':W.show=true;render();break;
    case 's-swap':W.i++;W.talks++;W.show=false;W.anim='pop';SND.swap();render();break;
    case 'r-pick':W.choice=+d.i;S.reflect=W.choice;save();SND.right();render();break;
    case 'r-again':W.choice=null;render();break;
    case 'r-done':{const t=$('#mistake');if(t){S.mistake=t.value;if(t.value.trim())earnOnce('mistake')}save();complete('reflect');break}
    case 'mission-call':SND.mission();setTimeout(()=>say(S.mission),900);break;
    case 'mission-save':{const v=$('#mission-in').value.trim();if(v){S.mission=v;save();pushCS();render()}break}
    case 't-set':tStop();T.total=T.left=(+d.m)*60;tDraw();break;
    case 't-go':
      if(T.run){tStop();tDraw();break}
      if(T.left<=0)T.left=T.total;
      T.run=true;T.id=setInterval(()=>{T.left--;tDraw();if(T.left<=0){tStop();tDraw();SND.bigben()}},1000);
      stops.push(tStop);tDraw();break;
    case 't-reset':tStop();T.left=T.total;tDraw();break;
    case 'snd':SND[d.s]();break;
    case 'mk-pairs':{
      const n=readClass(),nums=shuffle(Array.from({length:n},(_,i)=>i+1)),out=[];
      for(let i=0;i+1<nums.length;i+=2)out.push([nums[i],nums[i+1]]);
      if(n%2&&out.length)out[out.length-1].push(nums[n-1]);
      PAIRS_OUT=`<div class="pairs">${out.map(p=>`<span>${p.join(' + ')}</span>`).join('')}</div>`;render();break}
    case 'mk-jobs':{const n=readClass();JOBS_OUT=shuffle(Array.from({length:n},(_,i)=>i+1)).slice(0,4);render();break}
    case 'coin':{readClass();const r=pick(['A','B']);PAIRS_OUT=`<div class="pairs"><span style="font-size:1.3rem">${r} beginnt · ${ROLE[r]}</span></div>`;SND.right();render();break}
    case 'rk':S.rocket=Math.max(0,Math.min(10,S.rocket+(+d.d)));save();if(+d.d>0)S.rocket>=10?SND.cheer():SND.right();if(CS){CS.rocket=S.rocket;pushCS()}render();break;
    case 'rk0':S.rocket=0;save();render();break;
    case 'sim':{const day=+$('#sim-day').value,t=$('#sim-time').value||'08:45';SIM={day,min:toMin(t),setAt:Date.now()};tickClock();checkSlot();if(!$('#ov').hidden)break;render();break}
    case 'sim-off':SIM=null;tickClock();render();break;
    case 'reset-ask':ASK=true;render();break;
    case 'reset-no':ASK=false;render();break;
    case 'reset-yes':{const keep={mission:S.mission,rocket:S.rocket,classSize:S.classSize};S=Object.assign(def(),keep);save();ASK=false;hdr();render();break}
  }
});
function readClass(){const el=$('#cls');let n=el?parseInt(el.value,10):S.classSize;if(!(n>=2&&n<=40))n=S.classSize;S.classSize=n;save();return n}

$('#star-ico').innerHTML=STAR;
if(BOARD){document.body.classList.add('boardwin');V={name:'beamer'};Live.start(S.code);libLoad();
  document.addEventListener('dblclick',e=>{if(e.target.closest('button'))return;try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}});
  setTimeout(()=>{const h=document.createElement('div');h.className='bw-hint';h.textContent='Fenster auf den Beamer ziehen · Doppelklick = Vollbild';document.body.appendChild(h);setTimeout(()=>{h.style.opacity=0;setTimeout(()=>h.remove(),700)},6000)},300)}
else if(!S.role)V={name:'role'};
else{Live.start(S.code).then(()=>{if(S.role==='teacher')pushCS();else sendMsg({k:'hi'})});if(S.role==='teacher'){initTeacher();V={name:'tdash'}}}
hdr();tickClock();render();
if(S.role==='teacher')libLoad();
if(CLOUD&&!BOARD)cloudBoot();
try{speechSynthesis.getVoices()}catch(e){}
let lastMin=-1;
setInterval(()=>{
  tickClock();
  const m=nowInfo().min;
  if(m!==lastMin){lastMin=m;checkSlot();checkJournalAuto();if(V.name==='dash'||V.name==='week')render()}
},5000);
setTimeout(checkSlot,400);
// Live heartbeat: teacher re-sends the class state, students say hello
setInterval(()=>{
  if(S.role==='teacher'&&CS){pushCS();if(V.name==='tafel')updTafel()}
  if(S.role==='student'){sendMsg({k:'hi'});updBanner()}
},3000);
setInterval(()=>{
  if(S.role==='teacher'&&CS){
    if(CS.timer.run&&timerLeft(CS.timer)<=0){CS.timer.run=false;CS.timer.left=0;SND.bigben();pushCS();if(V.name==='tafel')render()}
    const t=$('#ttime');if(t){const l=timerLeft(CS.timer);t.textContent=fmt(l);$('#tring').style.setProperty('--p',CS.timer.total?l/CS.timer.total:0)}
  }
  if(S.role==='student'&&RCS){const t=$('#ltimer');if(t)t.textContent=fmt(timerLeft(RCS.timer,OFF))}
},1000);
</script>
